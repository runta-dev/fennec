name: BYOC image
# Builds the self-hosted cloud image, verifies it with Fennec's real client
# code, and publishes it to Docker Hub only for byoc-v* tags. Publishing needs the
# DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret (a Docker Hub access
# token with read and write scope).
on:
  push:
    tags: ['byoc-v*']
  pull_request:
    paths:
      - deploy/byoc/**
      - cmd/fennec-cloud/**
      - internal/cloudimage/**
      - internal/byoc/**
      - .dockerignore
      - .github/workflows/byoc-image.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/fennec-cloud
jobs:
  verify:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./internal/cloudimage ./cmd/fennec-cloud ./internal/byoc/...
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for this runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/byoc/Dockerfile
          load: true
          tags: fennec-cloud:verify
      - name: Pair, connect and bootstrap with Fennec's client
        env:
          FENNEC_BYOC_IMAGE: fennec-cloud:verify
          FENNEC_BYOC_BOOTSTRAP: '1'
        run: go test -count=1 -v ./deploy/byoc

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/byoc-v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=byoc-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=byoc-v(\d+\.\d+)\.\d+,group=1
            type=match,pattern=byoc-v(\d+)\.\d+\.\d+,group=1
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/byoc/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
