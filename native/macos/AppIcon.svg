<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
<title>Fennec app icon</title>
<!-- Same look as the iOS icon (ios/Fennec/Assets.xcassets/AppIcon.appiconset/icon-light.png):
     the fox on a warm #fffaf3 -> #ffe9cc vertical gradient. Drawn on Apple's macOS icon grid:
     an 824 px rounded tile inset 100 px, with a soft drop shadow. The fox is 54% of the tile
     wide, as on iOS. -->
<defs>
  <linearGradient id="bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFAF3"/>
    <stop offset="1" stop-color="#FFE9CC"/>
  </linearGradient>
  <filter id="shadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
  </filter>
</defs>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
<rect x="100.5" y="100.5" width="823" height="823" rx="184.5" stroke="#000" stroke-opacity="0.06"/>
<g transform="translate(248.8 246.8) scale(8.225)">
  <path d="M5 39V9c0-3 2-4 4-2l23 15L55 7c2-2 4-1 4 2v30L34 57c-1.2.9-2.8.9-4 0Z" fill="#FFD8A1"/>
  <path class="fox-ear-left" d="m8 6 24 16-12 9Z" fill="#FFB953"/>
  <path class="fox-ear-right" d="m56 6-24 16 12 9Z" fill="#F7A136"/>
  <path d="M5 39 30 22c1.2-.8 2.8-.8 4 0l25 17-25 18c-1.2.9-2.8.9-4 0Z" fill="#F38D25"/>
  <path d="m5 39 27-17v36L30 57Z" fill="#FFA83F"/>
  <circle class="fox-eye" cx="24" cy="40" r="2.6" fill="#3B332E"/>
  <circle class="fox-eye" cx="40" cy="40" r="2.6" fill="#3B332E"/>
  <ellipse cx="32" cy="52" rx="3.2" ry="3.3" fill="#3B332E"/>
</g>
</svg>
