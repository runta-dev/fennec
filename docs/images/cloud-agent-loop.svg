<style>
text{font-family:'Bradley Hand','Bradley Hand ITC','Segoe Print','Comic Sans MS',cursive;fill:#284E6E;font-size:25px}
.ink{stroke:#315F83;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.echo{stroke:#315F83;stroke-width:1;stroke-linecap:round;fill:none;opacity:.4}
.orange{stroke:#E18736;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.small{font-size:18px;fill:#6E7C88}
</style>
<rect width="1200" height="720" rx="16" fill="white"/>
<text x="600" y="55" text-anchor="middle" font-size="34">Cloud agent loops</text>
<path d="M455 68q140-8 292 0m-281 4q136-8 268 0" class="orange"/>
<!-- A cloud computer containing familiar agents, as in the user's sketch. -->
<path d="M252 101 948 103 951 329 249 332Z" class="ink"/>
<path d="M255 98 944 101M247 106l1 222m6 7 690-3m10-224-1 217" class="echo"/>
