<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Fennec: cloud brains, local hands</title>
<desc id="desc">Codex, Claude Code, and Pi run as persistent agent sessions inside a cloud computer. The local Mac provides approved files and commands while online. Work locally, close the Mac while cloud-only work continues, and attach to the same session on return.</desc>
<defs><symbol id="fennec" viewBox="0 0 64 64" fill="currentColor">
  <path d="M5 39V9c0-3 2-4 4-2l23 15L55 7c2-2 4-1 4 2v30L34 57c-1.2.9-2.8.9-4 0Z" fill="#FFD8A1"/>
  <path class="fox-ear-left" d="m8 6 24 16-12 9Z" fill="#FFB953"/>
  <path class="fox-ear-right" d="m56 6-24 16 12 9Z" fill="#F7A136"/>
  <path d="M5 39 30 22c1.2-.8 2.8-.8 4 0l25 17-25 18c-1.2.9-2.8.9-4 0Z" fill="#F38D25"/>
  <path d="m5 39 27-17v36L30 57Z" fill="#FFA83F"/>
  <circle class="fox-eye" cx="24" cy="40" r="2.6" fill="#3B332E"/>
  <circle class="fox-eye" cx="40" cy="40" r="2.6" fill="#3B332E"/>
  <ellipse cx="32" cy="52" rx="3.2" ry="3.3" fill="#3B332E"/>
</symbol>
