<text x="600" y="666" text-anchor="middle" class="small">Cloud work continues</text>
<path d="M777 579q27-3 56 0m-10-7 10 7-10 6" class="orange"/>
<path d="m874 455 251 1 1 133-252-1Z" class="ink"/>
<path d="m878 452 243 2m7 7-1 124m-250 7 246-1" class="echo"/>
