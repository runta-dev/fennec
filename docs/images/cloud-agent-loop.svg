<path d="M736 130q88-4 180 1l-3 20q-84-4-176 0Z" fill="#F8DABB" opacity=".65"/>
<text x="826" y="149" text-anchor="middle" font-size="23">Brain · 24×7</text>
<path d="M271 167q331 3 660-1" class="echo"/>
<use href="#codex" x="346" y="196" width="55" height="55"/>
<use href="#claude" x="560" y="196" width="55" height="55"/>
