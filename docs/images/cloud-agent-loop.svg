<path d="m78 459 244-2m-247 4-1 122m3 9 246-1" class="echo"/>
<path d="m72 588-18 13q132 9 290 0l-17-12m-149 8 47-1" class="ink"/>
<path d="M91 476h217v95H91Z" stroke="#D5DFE6" fill="#FBFCFD"/>
<text x="110" y="518" font-family="monospace" font-size="20">$ codex</text>
<path d="M112 538h20l6 6h27v17h-53Zm73 5 9 6-9 6m17 0h13" class="ink"/>
<text x="200" y="639" text-anchor="middle" font-size="27">Work locally</text>
<text x="200" y="666" text-anchor="middle" class="small">Local hands</text>
