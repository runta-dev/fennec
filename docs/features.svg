  <defs>
    <symbol id="terminal" viewBox="0 0 24 24">
      <g class="icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="m6.75 7.5 3 2.25-3 2.25m4.5 0h3m-9 8.25h13.5A2.25 2.25 0 0 0 21 18V6a2.25 2.25 0 0 0-2.25-2.25H5.25A2.25 2.25 0 0 0 3 6v12a2.25 2.25 0 0 0 2.25 2.25Z"/>
      </g>
    </symbol>
    <symbol id="laptop" viewBox="0 0 24 24">
      <g class="icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25m18 0A2.25 2.25 0 0 0 18.75 3H5.25A2.25 2.25 0 0 0 3 5.25m18 0V12a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 12V5.25"/>
      </g>
    </symbol>
    <symbol id="cloud" viewBox="0 0 24 24">
      <g class="icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 0 0 4.5 4.5H18a3.75 3.75 0 0 0 1.332-7.257 3 3 0 0 0-3.758-3.848 5.25 5.25 0 0 0-10.233 2.33A4.502 4.502 0 0 0 2.25 15Z"/>
      </g>
    </symbol>
    <symbol id="shield" viewBox="0 0 24 24">
      <g class="icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/>
      </g>
    </symbol>
    <symbol id="resume" viewBox="0 0 24 24">
      <g class="icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/>
      </g>
    </symbol>
    <symbol id="agents" viewBox="0 0 24 24">
      <g class="icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z"/>
      </g>
    </symbol>
  </defs>

  <g transform="translate(1 1)">
    <rect class="card" width="546" height="250" rx="14"/>
    <use href="#terminal" x="28" y="28" width="32" height="32"/>
    <text class="heading" x="78" y="53">Keep your favorite tools</text>
    <text class="body" x="28" y="104">
      <tspan x="28">Keep <tspan class="emphasis">tmux, cmux, and Herdr</tspan> in your workflow.</tspan>
      <tspan x="28" dy="30">Use the terminal you already know, with</tspan>
      <tspan x="28" dy="30">persistent cloud sessions and approved</tspan>
      <tspan x="28" dy="30">access to your local tools.</tspan>
    </text>
  </g>
  <g transform="translate(573 1)">
    <rect class="card" width="546" height="250" rx="14"/>
    <use href="#laptop" x="28" y="28" width="32" height="32"/>
    <text class="heading" x="78" y="53">Work on your local project</text>
    <text class="body" x="28" y="104">
      <tspan x="28">Keep your editor, repository, and tools</tspan>
      <tspan x="28" dy="30">on your Mac. Choose <tspan class="emphasis">Cloud computer</tspan></tspan>
      <tspan x="28" dy="30">for the agent loop, and approve the local</tspan>
      <tspan x="28" dy="30">files and commands it needs.</tspan>
    </text>
  </g>
  <g transform="translate(1 277)">
    <rect class="card" width="546" height="326" rx="14"/>
    <use href="#cloud" x="28" y="28" width="32" height="32"/>
    <text class="heading" x="78" y="53">Step away from a long task</text>
    <text class="body" x="28" y="104">
      <tspan x="28">Detach, close your laptop—even shut it down.</tspan>
      <tspan x="28" dy="30">Cloud work keeps running once it has what</tspan>
      <tspan x="28" dy="30">it needs. Tasks that need your Mac wait</tspan>
      <tspan x="28" dy="30">until it is reachable again.</tspan>
    </text>
  </g>
  <g transform="translate(573 277)">
    <rect class="card" width="546" height="326" rx="14"/>
    <use href="#shield" x="28" y="28" width="32" height="32"/>
    <text class="heading" x="78" y="53">Your Mac, your rules</text>
    <text class="body" x="28" y="104">
      <tspan x="28"><tspan class="emphasis">Governance &amp; Sandbox</tspan> protects credentials,</tspan>
      <tspan x="28" dy="28">SSH keys, and Keychain data, and confines</tspan>
      <tspan x="28" dy="28">sandboxed writes to approved folders.</tspan>
      <tspan x="28" dy="40">With <tspan class="emphasis">Ask for approval</tspan>, broader access and</tspan>
      <tspan x="28" dy="28">forced file deletion need your authorization.</tspan>
      <tspan x="28" dy="28">Delegate review with <tspan class="emphasis">Approve for me</tspan>, or</tspan>
      <tspan x="28" dy="28">explicitly lift the sandbox with <tspan class="emphasis">Full access</tspan>.</tspan>
    </text>
  </g>
  <g transform="translate(1 629)">
    <rect class="card" width="546" height="250" rx="14"/>
    <use href="#resume" x="28" y="28" width="32" height="32"/>
    <text class="heading" x="78" y="53">Pick up where you left off</text>
    <text class="body" x="28" y="104">
      <tspan x="28">Come back, run <tspan class="emphasis">fen</tspan>, and select the same</tspan>
      <tspan x="28" dy="30">session. Review its output, answer a question,</tspan>
      <tspan x="28" dy="30">or continue the work from your own terminal.</tspan>
    </text>
  </g>
  <g transform="translate(573 629)">
    <rect class="card" width="546" height="250" rx="14"/>
    <use href="#agents" x="28" y="28" width="32" height="32"/>
    <text class="heading" x="78" y="53">Keep track of your agents</text>
    <text class="body" x="28" y="104">
      <tspan x="28">See <tspan class="emphasis">Idle, Working, Needs input, and Errored</tspan></tspan>
      <tspan x="28" dy="30">sessions in the menu bar. Copy their attach</tspan>
      <tspan x="28" dy="30">commands, or explicitly stop work you no</tspan>
      <tspan x="28" dy="30">longer need.</tspan>
    </text>
  </g>
</svg>
