<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="880" viewBox="0 0 1120 880" role="img" aria-labelledby="title description">
  <title id="title">Fennec features: cloud freedom, local control</title>
  <desc id="description">Six features: keep tmux, cmux, and Herdr; work on your local project; let cloud work continue while your Mac is closed; protect local credentials with Governance and Sandbox, with approval for broader access and forced deletion in Ask for approval mode; reattach to the same session; and manage agent status from the menu bar. Approve for me delegates review, while Full access explicitly lifts the sandbox.</desc>
  <style>
    :root { color-scheme: light dark; --surface: #f6f8fa; --border: #d1d9e0; --heading: #1f2328; --body: #4b5563; --icon: #59636e; }
    @media (prefers-color-scheme: dark) {
      :root { --surface: #151b23; --border: #3d444d; --heading: #f0f6fc; --body: #b1bac4; --icon: #b1bac4; }
    }
    .card { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
    .icon { fill: var(--icon); }
    .cutout { fill: var(--surface); }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .heading { fill: var(--heading); font-size: 25px; font-weight: 500; }
    .body { fill: var(--body); font-size: 20px; font-weight: 400; }
    .emphasis { fill: var(--heading); font-weight: 500; }
  </style>
  <defs>
    <symbol id="terminal" viewBox="0 0 32 32">
      <path class="icon" d="M5 4h22a3 3 0 0 1 3 3v18a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z"/>
      <path class="cutout" d="m8 10 6 6-6 6-2-2 4-4-4-4Zm8 10h9v3h-9Z"/>
    </symbol>
    <symbol id="laptop" viewBox="0 0 32 32">
      <path class="icon" fill-rule="evenodd" d="M6 4h20a3 3 0 0 1 3 3v16H3V7a3 3 0 0 1 3-3Zm1 4v11h18V8Z"/>
      <path class="icon" d="M1 25h11l1 2h6l1-2h11v2a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3Z"/>
    </symbol>
    <symbol id="cloud" viewBox="0 0 32 32">
      <g class="icon">
        <circle cx="9" cy="20" r="7"/>
        <circle cx="17" cy="14" r="9"/>
        <circle cx="25" cy="20" r="6"/>
        <rect x="9" y="20" width="16" height="7"/>
      </g>
      <path class="cutout" d="m17 10-7 10h5l-1 6 8-11h-5Z"/>
    </symbol>
    <symbol id="shield" viewBox="0 0 32 32">
      <path class="icon" d="m16 1 13 5v10c0 7-7 12-13 15C10 28 3 23 3 16V6Z"/>
      <path class="cutout" d="m8 16 3-3 4 4 7-8 3 3-10 11Z"/>
    </symbol>
    <symbol id="resume" viewBox="0 0 32 32">
      <path class="icon" d="M16 3a13 13 0 1 1-12.1 18H8a9 9 0 1 0 2-11l4 4H2V2l5 5a12.9 12.9 0 0 1 9-4Z"/>
      <path class="icon" d="m14 10 9 6-9 6Z"/>
    </symbol>
    <!-- Reuse the product's flat fox mark from native/macos/UI/icons/fennec.svg. -->
    <symbol id="fennec" viewBox="0 0 64 64">
      <path d="M5 39V9c0-3 2-4 4-2l23 15L55 7c2-2 4-1 4 2v30L34 57c-1.2.9-2.8.9-4 0Z" fill="#ffd8a1"/>
      <path d="m8 6 24 16-12 9Z" fill="#ffb953"/>
      <path d="m56 6-24 16 12 9Z" fill="#f7a136"/>
      <path d="M5 39 30 22c1.2-.8 2.8-.8 4 0l25 17-25 18c-1.2.9-2.8.9-4 0Z" fill="#f38d25"/>
      <path d="m5 39 27-17v36L30 57Z" fill="#ffa83f"/>
      <circle cx="24" cy="40" r="2.6" fill="#3b332e"/>
      <circle cx="40" cy="40" r="2.6" fill="#3b332e"/>
      <ellipse cx="32" cy="52" rx="3.2" ry="3.3" fill="#3b332e"/>
    </symbol>
  </defs>

  <g transform="translate(1 1)">
    <rect class="card" width="546" height="250" rx="14"/>
    <use href="#terminal" x="28" y="28" width="32" height="32"/>
    <text class="heading" x="78" y="53">Keep your favorite tools</text>
    <text class="body" x="28" y="104">
      <tspan x="28">Keep <tspan class="emphasis">tmux, cmux, and Herdr</tspan> in your workflow.</tspan>
      <tspan x="28" dy="30">Use the terminal you already know, with</tspan>
      <tspan x="28" dy="30">persistent cloud sessions and approved</tspan>
      <tspan x="28" dy="30">access to your local tools.</tspan>
    </text>
  </g>
  <g transform="translate(573 1)">
    <rect class="card" width="546" height="250" rx="14"/>
    <use href="#laptop" x="28" y="28" width="32" height="32"/>
    <text class="heading" x="78" y="53">Work on your local project</text>
    <text class="body" x="28" y="104">
      <tspan x="28">Keep your editor, repository, and tools</tspan>
      <tspan x="28" dy="30">on your Mac. Choose <tspan class="emphasis">Cloud computer</tspan></tspan>
      <tspan x="28" dy="30">for the agent loop, and approve the local</tspan>
      <tspan x="28" dy="30">files and commands it needs.</tspan>
    </text>
  </g>
  <g transform="translate(1 277)">
    <rect class="card" width="546" height="326" rx="14"/>
    <use href="#cloud" x="28" y="28" width="32" height="32"/>
    <text class="heading" x="78" y="53">Step away from a long task</text>
    <text class="body" x="28" y="104">
      <tspan x="28">Detach, close your laptop—even shut it down.</tspan>
      <tspan x="28" dy="30">Cloud work keeps running once it has what</tspan>
      <tspan x="28" dy="30">it needs. Tasks that need your Mac wait</tspan>
      <tspan x="28" dy="30">until it is reachable again.</tspan>
    </text>
  </g>
  <g transform="translate(573 277)">
    <rect class="card" width="546" height="326" rx="14"/>
    <use href="#shield" x="28" y="28" width="32" height="32"/>
    <text class="heading" x="78" y="53">Your Mac, your rules</text>
    <text class="body" x="28" y="104">
      <tspan x="28"><tspan class="emphasis">Governance &amp; Sandbox</tspan> protects credentials,</tspan>
      <tspan x="28" dy="28">SSH keys, and Keychain data, and confines</tspan>
      <tspan x="28" dy="28">sandboxed writes to approved folders.</tspan>
      <tspan x="28" dy="40">With <tspan class="emphasis">Ask for approval</tspan>, broader access and</tspan>
      <tspan x="28" dy="28">forced file deletion need your authorization.</tspan>
      <tspan x="28" dy="28">Delegate review with <tspan class="emphasis">Approve for me</tspan>, or</tspan>
      <tspan x="28" dy="28">explicitly lift the sandbox with <tspan class="emphasis">Full access</tspan>.</tspan>
    </text>
  </g>
  <g transform="translate(1 629)">
    <rect class="card" width="546" height="250" rx="14"/>
    <use href="#resume" x="28" y="28" width="32" height="32"/>
    <text class="heading" x="78" y="53">Pick up where you left off</text>
    <text class="body" x="28" y="104">
      <tspan x="28">Come back, run <tspan class="emphasis">fen</tspan>, and select the same</tspan>
      <tspan x="28" dy="30">session. Review its output, answer a question,</tspan>
      <tspan x="28" dy="30">or continue the work from your own terminal.</tspan>
    </text>
  </g>
  <g transform="translate(573 629)">
    <rect class="card" width="546" height="250" rx="14"/>
    <use href="#fennec" x="26" y="26" width="36" height="36"/>
    <text class="heading" x="78" y="53">Keep track of your agents</text>
    <text class="body" x="28" y="104">
      <tspan x="28">See <tspan class="emphasis">Idle, Working, Needs input, and Errored</tspan></tspan>
      <tspan x="28" dy="30">sessions in the menu bar. Copy their attach</tspan>
      <tspan x="28" dy="30">commands, or explicitly stop work you no</tspan>
      <tspan x="28" dy="30">longer need.</tspan>
    </text>
  </g>
</svg>
