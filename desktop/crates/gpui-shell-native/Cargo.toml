[package]
name = "gpui-shell-native"
version = "0.0.0"
description = "The native parts of gpui-kit's gpui-shell that herdr-app's terminal core uses, without its script engine"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui-base = { path = "../../vendor/gpui-kit/crates/base" }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
serde_json = "1"
instant = "0.1"
