# Fennec desktop. Built on herdr-app (https://github.com/herdrdev/herdr-app,
# Apache-2.0): its terminal core and GPUI patches are kept as-is, see UPSTREAM.md.
[workspace]
members = ["crates/ghostty-sys", "crates/gpui-shell-native"]
exclude = ["vendor/gpui-kit", "vendor/gpui-pre", "vendor/gpui-pre-wgpu", "vendor/gpui-pre-apple", "vendor/gpui-pre-linux", "vendor/gpui-pre-macos", "vendor/taffy", "vendor/zed-xim", "vendor/xim-ctext"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[package]
name = "fennec-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ghostty-sys = { path = "crates/ghostty-sys" }
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["render-to-image"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
# The native parts of gpui-shell the terminal core uses; Fennec runs no scripts.
gpui-shell = { package = "gpui-shell-native", path = "crates/gpui-shell-native" }
gpui-base = { path = "vendor/gpui-kit/crates/base" }
anyhow = "1"
async-channel = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "tiff", "bmp"] }
png = "0.17"
ttf-parser = "0.25"
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fancy-regex = "0.19"
regex = "1"
notify = "7"
sha2 = "0.10"


[target.'cfg(target_os = "linux")'.dependencies]
gpui_linux = { package = "gpui-pre-linux", version = "=0.3.8", features = ["render-to-image"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { package = "gpui-pre-macos", version = "=0.3.8", features = ["render-to-image"] }
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSDockTile", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString"] }


[patch.crates-io]
# HERDR: production frame capture without test-support dependencies.
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
# Our copy: an idle window stops waking every vsync (patches marked HERDR:).
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
# Our copy: snapping a maximized window to a half kept its old size (HERDR:).
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
# HERDR: XIM's Latin-1/COMPOUND_TEXT must decode without panicking.
zed-xim = { path = "vendor/zed-xim" }
xim-ctext = { path = "vendor/xim-ctext" }
# Our copy: a flex item's min-content was measured even when unused (HERDR:).
taffy = { path = "vendor/taffy" }


# With --target (CI builds Intel Macs on Apple Silicon), stripping a macOS
# proc-macro loses what rustc loads from it: "can't find crate". Build-time
# code only; the app itself is still stripped.
[profile.release.build-override]
strip = "none"

[profile.dev.package."*"]
opt-level = 2
