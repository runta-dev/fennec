      - rust/desk-core/src/shot.rs::a_backend_capture_paints_the_unadmitted_windows_black

  - id: CAP-DSK-032
    title: Screenshot encoding and cropping
    behavior: >-
      Captures are taken in a driver session separate from input. A region crop is given in screen points
      and scaled to image pixels by the backing scale, clamped to the image, and a rectangle wholly outside
      the image fails; the cropped PNG holds exactly the source pixels of the rectangle as RGB, and encoding
      then decoding a capture reproduces its pixels bit for bit.
    surface: observe
    parity: spec
    tests: [internal/vision.TestCropScalesAndClamps, internal/vision.TestPNGRoundTrip, internal/driver.TestCaptureSessionSeparate]
    upstream:
