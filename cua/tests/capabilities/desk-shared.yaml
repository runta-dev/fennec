  - id: CAP-DSK-030
    title: App allowlist hides and refuses other apps
    behavior: >-
      With an app allowlist (case-insensitive app names), the window list shows only admitted apps' windows;
      outlines, refs, point hit tests, element actions, clicks, launches and desktop-wide keys or typing whose
      target (the front window for untargeted input) is outside it are refused with nothing sent, and
      not-found errors list only admitted windows. Pointer steps are gated on every point they touch: both
      ends of a drag and the point of a scroll; a point over no window is refused. Named background input is
      gated on its target app, not on whatever window covers the point.
    surface: policy
    parity: oracle
    tests: [internal/policy.TestAllowlistHidesWindows, internal/policy.TestAllowlistGatesEveryPoint, internal/policy.TestAllowlistGatesNamedTargetNotCover]
    upstream:
      - rust/desk/src/desk.rs::an_app_allowlist_hides_and_refuses_the_windows_of_other_apps
      - rust/desk/src/desk.rs::an_app_allowlist_gates_every_point_and_element_a_call_reaches
      - rust/desk/src/desk.rs::an_app_allowlist_gates_both_ends_of_a_drag_and_the_point_of_a_scroll
      - rust/desk/src/desk.rs::the_allowlist_gates_named_background_input_on_its_target_app_not_on_what_covers_it

  - id: CAP-DSK-031
    title: Allowlist blackout in screenshots
    behavior: >-
      With an allowlist, screen and region captures paint every pixel outside admitted windows black (crops
      included), and a window that moves or leaves while the capture is taken is never shown: the capture is
      retried (up to 3 times) until the window set is stable, else it fails asking to retry. Without an
      allowlist no masking work is done and only one capture call is made.
    surface: policy
    parity: oracle
    tests: [internal/policy.TestCaptureBlackout, internal/policy.TestCaptureMaskStableWindows]
    upstream:
      - rust/desk/src/desk.rs::an_app_allowlist_masks_shots_outside_its_windows_and_costs_nothing_without_one
