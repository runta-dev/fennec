    reason: >-
      Linux-only desk behaviour that the test suite runs on every platform: AT-SPI raw key bindings,
      desktop-shell windows and the unanswered _NET_ACTIVE_WINDOW probe (null on macOS), desktop-file app ids,
      the raise-instead-of-launch rule, XTest typing and keysym names, eight-character text runs, MIT-SHM
      captures with the driver's cursor overlay, and a Linux driver session that drops reads. None has a macOS
      counterpart.
