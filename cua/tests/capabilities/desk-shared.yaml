  - id: CAP-DSK-028
    title: Picking a window by title, pid or activity
    behavior: >-
      A window name resolves by exact title, then trimmed case-insensitive title, then contained title,
      skipping unlisted and unfocusable windows; with a pid, only that app's windows count and a pid alone
      takes that app's front window even while another app has focus. Among equal titles the active one wins,
      else the newest shown one, and a lone hidden or minimized window is still reachable; a title that only
      matches a hidden twin loses to the on-screen one. A stale title falls back to its app's window only when
      that is unambiguous (one window, or the active one), otherwise the error lists that app's window titles.
      focus and close of one of two same-titled windows act on the active one.
    surface: observe
    parity: oracle
    tests: [internal/view.TestWindowPickTiers, internal/view.TestWindowPickEqualTitles, internal/view.TestStaleTitleFallback, internal/actions.TestFocusCloseActiveTwin]
    upstream:
