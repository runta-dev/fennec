  - id: CAP-DSK-037
    title: Find by name
    behavior: >-
      find compares names after normalising them: case folded, label punctuation such as leading underscores,
      trailing colons and ellipses dropped, whitespace collapsed. Exact normalised matches win over contained
      ones; an optional role filter takes alternatives separated by "|"; an empty or punctuation-only query
