  - id: CAP-DSK-038
    title: Element value reads
    behavior: >-
      observe scope=element without full text returns the element's whole name and the first 80 characters
      of its value as a preview, with no truncation flag. With full text it returns up to 65,536 characters,
      the head by default or with tail the end, cut on whole characters (multi-byte and emoji never split),
      and flags truncated only when something was cut; asking for tail without full text is an error. With
      the web option on macOS the read also gives the page URL of the containing document and the element's
      DOM id where exposed; a plain read gives neither.
    surface: observe
