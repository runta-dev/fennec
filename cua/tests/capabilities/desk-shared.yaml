      - rust/desk/src/desk.rs::a_read_with_web_adds_the_page_address_and_dom_id_and_a_plain_read_does_not

  - id: CAP-DSK-039
    title: Point hit tests
    behavior: >-
      observe scope=point returns the element under a screen point, its ancestors and its process id. Without
      a named window it reads the topmost app window at the point (not the front window), choosing among
      same-titled twins the one whose bounds hold the point and failing when twins cannot be told apart; a
      point over no app window fails with a hint to name a window or pid; an unadmitted window under the point
      is refused by the allowlist. When another window covers the point the answer names it (title, pid).
    surface: observe
    parity: oracle
    tests: [internal/view.TestPointHitTopWindow, internal/view.TestPointHitCover]
    upstream:
