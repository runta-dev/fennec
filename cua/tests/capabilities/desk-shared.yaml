      - rust/desk/src/desk.rs::closing_one_of_two_same_titled_windows_closes_the_active_one

  - id: CAP-DSK-029
    title: Long titles the window server elides
    behavior: >-
      A window is addressed by its full accessibility title even when the driver's window list shows it
      elided; fennec-cua matches the two by window number. A not-found error lists full titles, and a point
      hit test reports the full title of the window under the point.
