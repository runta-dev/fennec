      - rust/desk/src/desk.rs::at_without_a_window_reads_the_twin_whose_bounds_hold_the_point
      - rust/desk/src/desk.rs::at_names_the_window_that_covers_the_point

  - id: CAP-DSK-040
    title: Pid-scoped accessibility reads
    behavior: >-
      Without an allowlist, an outline, find, hit test or close that names a pid reads only that app's
      windows instead of enumerating every app; with an allowlist such calls still enumerate every window so
      the allowlist judges the full picture. A pid-less outline still reads all apps.
    surface: observe
    parity: spec
    tests: [internal/ax.TestPidScopedReads]
    upstream:
