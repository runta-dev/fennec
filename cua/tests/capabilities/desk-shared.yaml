      - rust/desk/src/desk.rs::with_an_allowlist_a_call_that_names_a_process_still_reads_every_window

  - id: CAP-DSK-041
    title: Chromium web-tree switch with holders
    behavior: >-
      fennec-cua turns on a Chromium/Electron app's web accessibility tree for a holder (an MCP session, a
      run, a recording) and reports whether it was already on before the first hold. The tree stays on while
      any holder remains and goes off when the last holder lets go, but only if it was off originally; a run
      or recording lets go when it ends however it ends. Concurrent first holds are serialised so the
      original state is recorded once. An app outside the allowlist is refused and its tree is left alone.
    surface: observe
    parity: spec
    tests: [internal/ax.TestWebTreeHolders, internal/ax.TestWebTreeConcurrentFirstHolds]
    upstream:
      - rust/desk/src/desk.rs::a_page_tree_stays_on_while_anyone_holds_it_and_goes_off_with_the_last_hold

  - id: CAP-DSK-042
    title: Waiting for the window list to change
    behavior: >-
      wait for a window change answers with changed=true and the new window list as soon as it differs from
      the given baseline, or with changed=false and the unchanged list once the timeout (capped at 5 s) has
      passed in wall time, list reads included; a list read that ends past the deadline ends the wait, and a
      zero timeout reads the list once. Both the baseline and the fresh list are filtered by the allowlist
      before comparing, so unadmitted windows neither trigger a change nor appear.
    surface: wait
    parity: oracle
    tests: [internal/actions.TestWaitWindowChange, internal/actions.TestWaitTimeoutCountsListReads, internal/policy.TestWaitComparesAdmittedOnly]
    upstream:
      - rust/desk/src/desk.rs::a_wait_returns_the_new_window_list_once_a_window_opens
      - rust/desk/src/desk.rs::a_wait_without_a_change_returns_the_same_list_at_its_timeout
      - rust/desk/src/desk.rs::slow_window_lists_count_against_a_waits_timeout
      - rust/desk/src/desk.rs::a_read_that_ends_past_the_deadline_ends_the_wait
      - rust/desk/src/desk.rs::a_zero_timeout_wait_reads_the_list_once
      - rust/desk/src/desk.rs::a_wait_lists_and_compares_only_the_windows_the_allowlist_admits

  - id: CAP-DSK-043
    title: Cheap window-change polling and prompt cancellation
    behavior: >-
      While waiting, fennec-cua checks a cheap on-screen window fingerprint every 10 ms and reads the full
      window list immediately when it changes (also right after a slow list read), otherwise only every
      100 ms or the last read's duration, whichever is longer, so a steady screen costs few full lists. A wait
      cancelled early releases the desk at once for the next call.
    surface: wait
    parity: spec
    tests: [internal/ax.TestWindowFingerprintPolling, internal/daemon.TestCancelledWaitFreesDesk]
    upstream:
      - rust/desk/src/desk.rs::a_wait_ended_early_frees_the_desk_at_once
      - rust/desk/src/desk.rs::a_hint_change_right_after_a_slow_list_reads_the_list_at_once
      - rust/desk/src/desk.rs::a_steady_hint_spares_full_window_lists
      - rust/desk/src/desk.rs::a_hint_change_reads_the_window_list_at_once

  - id: CAP-DSK-044
    title: Screen stillness with volatile regions
    behavior: >-
      wait for stillness answers still=true once no 8-pixel block of a 320-pixel-wide capture has changed in
      a way that counts for hold_ms (default 40 ms), or still=false at timeout_ms (default 600 ms, at most
      5 s, checked between captures), with changed (whether anything counted during the wait), ms and the
      count of volatile blocks. A block that cycles through three or more contents (clock, spinner, video)
      stops counting, so a churning region does not hold the answer back. Each check is one capture of the
      whole screen and returns no pixels.
    surface: wait
    parity: oracle
    tests: [internal/vision.TestStillnessHoldAndTimeout, internal/vision.TestStillnessIgnoresVolatileBlocks]
    upstream:
      - rust/desk/src/desk.rs::still_answers_once_the_screen_holds_and_a_churning_region_does_not_hold_it_back

  - id: CAP-DSK-045
    title: Scroll and drag basics
    behavior: >-
      A scroll with x and y wheels that many notches (default 3) at that screen point; without a point it
      sends scroll keys to the front app window by pid and window id in the window session - with an
      allowlist, the window the allowlist picks, or that app's topmost window when the driver titles it
      differently. x without y is refused. A drag presses at the start point, moves and releases at the end
      point.
    surface: act
    parity: oracle
    tests: [internal/actions.TestScrollAtPointOrFrontWindow, internal/actions.TestDragTwoPoints]
    upstream:
      - rust/desk/src/desk.rs::a_scroll_wheels_at_its_point_or_at_the_front_window_and_a_drag_spans_two_points
      - rust/desk/src/desk.rs::a_checked_window_the_driver_titles_differently_falls_back_to_its_apps_topmost_window

