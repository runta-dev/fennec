  - id: CAP-DSK-026
    title: Background element clicks find the element's own window
    behavior: >-
      A background click on an element (act press/click by ref) goes to the element's own window, even when
      another window covers it, at the element's centre in that window's pixels, and is reported unconfirmed.
      The own window is matched by title and checked by frame (scale-aware; on macOS no resize-border slack):
      same-titled twins are told apart by frame, and a lone or fuzzy title match whose frame does not match is
      refused as ambiguous, as are twins the frames cannot separate; an element with no matching window is
      refused as not found. Nothing is clicked on refusal. Under background input on macOS the element actions
      focus, select and perform-action run without fronting the window.
