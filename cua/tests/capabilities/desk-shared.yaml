      - rust/desk/src/desk.rs::a_shot_captures_in_its_own_driver_session

  - id: CAP-DSK-033
    title: Launching apps on macOS
    behavior: >-
      act launch always asks the system to open the app (it never just raises an existing window) and the
      app stays in the background, which the result says. Arguments that include an option start a new
      instance with those arguments; arguments with no option (URLs, files) are handed to the running app as
      documents, starting no second instance. When the driver finds no app by the given name, the launch is
      retried once by the bundle name of a running app whose windows carry that name (e.g. Chrome to Google
      Chrome), keeping the URLs. With an allowlist, any argument starting with "-" is refused before launching.
    surface: act
    parity: oracle
    tests: [internal/actions.TestLaunchStaysBackground, internal/actions.TestLaunchArgsNewInstanceUrlsToRunning, internal/actions.TestLaunchRetryByBundleName, internal/policy.TestAllowlistRefusesLaunchFlags]
    upstream:
