    reason: >-
      Encoding of shuttle's private length-prefixed desk wire (frame layout, routing a frame by tool name
      without parsing arguments, its text/is_error/image_b64 JSON shape). fennec-cua has no second wire: the
      daemon speaks MCP JSON-RPC directly on its unix socket (README section 3.4), whose framing is covered by
      the mcp-surface catalog; the size limit is kept as CAP-DSK-047.
