domain: desk-shared
summary: Cross-cutting desk behaviour behind observe, act and wait on macOS - window picking, input delivery modes, Spaces, window-pixel coordinates, the app allowlist, shots, reads, typing and scheduling.
capabilities:
  - id: CAP-DSK-001
    title: Window list entries and stale windows
    behavior: >-
      observe scope=desktop lists each top-level window with its ref, title, role, pid, whether it is
      active and, when macOS reports it, the owning app's name; optional fields are omitted when unknown.
      A window whose app did not answer the listing in time is still listed from its last read and
      flagged stale, and any read or action aimed at it (outline, find, close) fails with an error saying
      the app is busy or hung, without touching it.
    surface: observe
    parity: oracle
    tests: [internal/view.TestWindowListFields, internal/view.TestStaleWindowListedNotActedOn]
    upstream:
      - rust/desk/src/desk.rs::a_window_names_its_app_when_the_backend_knows_it
      - rust/desk/src/desk.rs::a_window_kept_from_an_earlier_list_is_listed_but_never_acted_on

  - id: CAP-DSK-002
    title: Windows on another Space
    behavior: >-
      A window counts as unseen when it is on another Space, or (macOS) when it is not on screen, i.e.
      minimized or hidden. Under background or auto input, observe scope=desktop also lists windows on
      other Spaces, marked as on another Space and never active; under foreground input they are not listed.
      Under pure background input (not auto) an outline or find aimed at such a window, by title or by
      window ref, fails with a recoverable error saying it is on another Space (accessibility does not reach
      it there), while an unknown title fails with the ordinary not-found error that does not mention Spaces.
    surface: observe
    parity: oracle
    tests: [internal/ax.TestUnseenClassification, internal/view.TestOtherSpaceWindowsListedInBackground, internal/view.TestOutlineOfOtherSpaceWindowRefused]
    upstream:
      - rust/desk/src/desk.rs::a_window_is_unseen_on_another_space_and_on_macos_also_off_screen
      - rust/desk/src/desk.rs::background_input_lists_a_window_on_another_space_and_foreground_input_does_not
      - rust/desk/src/desk.rs::a_background_snapshot_of_a_window_on_another_space_says_so_by_title_or_id

  - id: CAP-DSK-003
    title: Background input into windows on another Space
    behavior: >-
      Background key, type, click, scroll and drag reach a window on another Space by its title or pid,
      including when every window of an allowlisted app is on another Space. When a title is shared by a
      window here and one on another Space, input goes to the one the title picks and the step is reported
      unconfirmed with a note that the app may not repaint an unseen window, so the input must not be sent
      again (typing adds: confirm the text before submitting). Title twins split across Spaces with several
      on each side are refused with nothing sent, naming how many are on this Space and how many elsewhere.
      An element click picks its own window by frame over a same-titled twin on another Space, while typing
      to those indistinguishable twins by title is refused; an element click that lands in a window on
      another Space is reported unconfirmed with the same do-not-resend note.
    surface: act
    parity: oracle
    tests: [internal/actions.TestBackgroundInputReachesOtherSpace, internal/actions.TestTitleTwinsAcrossSpacesRefused, internal/actions.TestElementClickOtherSpaceNote]
    upstream:
      - rust/desk/src/desk.rs::an_allowlisted_app_whose_windows_are_all_on_another_space_takes_background_input
      - rust/desk/src/desk.rs::background_input_to_a_title_twin_goes_to_the_window_on_a_space_and_says_not_to_send_it_again
      - rust/desk/src/desk.rs::background_input_to_title_twins_on_two_spaces_is_refused_and_names_both
      - rust/desk/src/desk.rs::a_background_element_click_picks_its_window_by_frame_over_a_title_twin_on_another_space
      - rust/desk/src/desk.rs::a_background_element_click_into_its_window_on_another_space_says_so

  - id: CAP-DSK-004
    title: Unseen windows - stale pixels and unconfirmed input
    behavior: >-
      On macOS observe image=window of a window on another Space, or minimized/hidden, still returns the
      image but marks it stale with a note that its app may not repaint it and that an unchanged image is
      not proof an action failed; a merely covered window gets no such mark. Background click or type into a
      minimized window that the driver cannot confirm is unconfirmed with a note that it may have taken
      effect and must not be resent (typing: confirm before Return/Send); into a covered but visible window
      the driver's own note is passed through unchanged. Once the window is restored, a click by screen point
      carries only the driver's note again.
    surface: observe
    parity: oracle
    tests: [internal/vision.TestWindowShotStaleMark, internal/actions.TestUnseenWindowInputNote]
    upstream:
      - rust/desk/src/desk.rs::a_macos_window_shot_says_its_pixels_may_be_stale_on_another_space_or_minimized_and_not_when_covered
      - rust/desk/src/desk.rs::unconfirmed_background_input_to_a_minimized_window_may_have_taken_effect_and_to_a_covered_one_keeps_the_driver_note
      - rust/desk/src/desk.rs::a_restored_window_clicked_by_its_point_keeps_the_driver_note

  - id: CAP-DSK-005
    title: Window shots on any display, crops and origin
    behavior: >-
      observe image=window captures the named window alone, picked as focus picks it (among a given pid's
      windows when one is given), on whichever display shows it, reading only that window's state (no
      accessibility tree, no full desktop capture); naming only a pid also captures that app's window. A
      crop rectangle is in the window image's own pixels and the answer gives the crop's top-left origin in
      the whole window image ([0,0] when uncropped; fractional offsets are truncated). A screen rectangle off
      the main display fails with a hint to name the window instead. A window outside the app allowlist is
      reported as not found, listing only admitted windows, and nothing is captured.
    surface: observe
    parity: oracle
    tests: [internal/vision.TestWindowShotAnyDisplay, internal/vision.TestWindowShotCropOrigin]
    upstream:
      - rust/desk/src/desk.rs::a_shot_by_window_captures_that_window_on_any_display_within_the_allowlist
      - rust/desk/src/desk.rs::a_cropped_window_shot_names_its_origin_in_the_window_pixels

  - id: CAP-DSK-006
    title: Window-image pixel coordinates for click, scroll and drag
    behavior: >-
      When a pointer step names a window, its x/y (and drag end points) are pixels of that window's image
      from observe image=window, on any display and any backing scale; fennec-cua maps them to the right
      screen point in foreground mode and passes them window-relative in background mode. Taking a window
      shot never changes the scale a later or concurrent click is mapped by, so a click before and after a
      shot of the same window lands on the same point. A drag in a window reads the display scale once.
    surface: act
    parity: oracle
    tests: [internal/vision.TestWindowPixelsMapAcrossScales, internal/actions.TestShotDoesNotShiftClickScale]
    upstream:
      - rust/desk/src/desk.rs::a_click_after_a_shot_of_its_window_lands_where_the_click_before_it_landed
      - rust/desk/src/desk.rs::with_a_window_x_and_y_are_pixels_of_its_shot_on_any_display_and_scale
      - rust/desk/src/desk.rs::a_scroll_or_drag_with_a_window_takes_pixels_of_its_shot
      - rust/desk/src/desk.rs::a_window_shot_during_a_click_does_not_change_the_scale_the_click_is_sent_by
      - rust/desk/src/desk.rs::a_drag_in_a_window_reads_the_screen_scale_once

  - id: CAP-DSK-007
    title: Ambiguous window titles refuse window-pixel points
    behavior: >-
      A click, scroll or drag whose x/y are window-image pixels is refused with nothing sent when the window
      title is shared by two windows (hint: name a window with a title of its own) or matches two windows at
      the same match tier (hint: use a longer title); a more specific title or a plain screen point works.
    surface: act
    parity: oracle
    tests: [internal/actions.TestWindowPixelsNeedUniqueTitle]
    upstream:
      - rust/desk/src/desk.rs::a_title_two_windows_share_takes_no_points_in_shot_pixels
      - rust/desk/src/desk.rs::a_title_that_matches_two_windows_at_one_tier_takes_no_points_in_shot_pixels

  - id: CAP-DSK-008
    title: Screen size in device pixels
    behavior: >-
      status (and observe image=screen metadata) reports the main screen's width and height in device
      pixels on a Retina Mac (logical size times backing scale, e.g. 2560x1600 at scale 2) together with the
      scale factor.
    surface: observe
    parity: oracle
    tests: [internal/vision.TestScreenSizeInPixels]
    upstream:
      - rust/desk/src/desk.rs::the_screen_is_in_pixels_on_a_retina_mac_and_as_the_driver_reports_it_elsewhere

  - id: CAP-DSK-009
    title: Background input goes to the named target without raising it
    behavior: >-
      Under background input, key, type (each line plus Return between lines), click, scroll and drag aimed
      at a window by title or by pid go to that window in the background delivery route, in the driver's
      window session, with no desktop scope and no raise of the window; a pid alone reaches that app's window
      even while another app is frontmost. Click/scroll/drag coordinates are converted into the target
      window's frame.
    surface: act
    parity: oracle
    tests: [internal/actions.TestBackgroundInputNoRaise, internal/actions.TestBackgroundPidReachesWindowBehind]
    upstream:
      - rust/desk/src/desk.rs::background_input_goes_to_the_named_window_without_raising_it
      - rust/desk/src/desk.rs::a_background_click_in_a_named_window_does_not_raise_it
      - rust/desk/src/desk.rs::background_input_naming_only_the_pid_of_an_app_behind_reaches_its_window

  - id: CAP-DSK-010
    title: Naming an app as the input target
    behavior: >-
      An input step may name its target app by app name instead of pid; when that app has no window the
      step is refused, saying the app has no window and nothing was sent, in every input mode. App names
      match case-insensitively on whole-word starts or ends of the app's name or process (e.g. "Chrome" for
      Google Chrome, "Text" for TextEdit, "Notepad++" exactly), never on a short inner fragment, an empty or
      blank name, or a different suffix such as "notepad" for "notepad++".
    surface: act
    parity: oracle
    tests: [internal/actions.TestAppTargetWithoutWindowRefused, internal/view.TestAppNameMatching]
    upstream:
      - rust/desk/src/desk.rs::input_naming_an_app_goes_to_that_app_or_nowhere
      - rust/desk/src/desk.rs::a_name_matches_the_start_or_end_of_app_words_never_a_short_fragment

  - id: CAP-DSK-011
    title: Background input needs a target and pointer acceptance
    behavior: >-
      Under background input, key, type, scroll and drag without a target window are refused (the step needs
      its target window), a scroll with x but not y is refused (both or neither), and click, scroll or drag
      into a window whose background pointer route the driver reports as refused are refused (no pointer
      input without the foreground); in all cases nothing is sent and nothing is raised. A step that asks for
      a delivery mode the current policy does not use (foreground under background, or the reverse) is
      refused before anything is sent; asking for the mode in force works.
    surface: policy
    parity: oracle
    tests: [internal/policy.TestBackgroundNeedsTarget, internal/policy.TestDeliveryModeMismatchRefused]
    upstream:
      - rust/desk/src/desk.rs::background_input_without_a_target_or_into_a_window_that_refuses_the_pointer_is_refused
      - rust/desk/src/desk.rs::input_asking_for_a_delivery_mode_the_desk_does_not_use_is_refused_before_it_is_sent

  - id: CAP-DSK-012
    title: Unconfirmed background input is flagged
    behavior: >-
      When the driver cannot confirm background input took effect, the step's status is unconfirmed with the
      driver's note (including any escalation it reports) and retry false; a confirmed background key gets a
      plain ok. Foreground typing reports a confirmed result with the character count and no note. Under
      auto input an unconfirmed (but not refused) background step returns its note and is not rerun in the
      foreground.
    surface: act
    parity: oracle
    tests: [internal/actions.TestUnconfirmedBackgroundFlagged, internal/policy.TestAutoKeepsUnconfirmedInBackground]
    upstream:
      - rust/desk/src/desk.rs::background_input_the_driver_cannot_confirm_says_so_and_foreground_input_does_not
      - rust/desk/src/desk.rs::auto_input_the_driver_could_not_confirm_returns_its_note_without_a_foreground_run

  - id: CAP-DSK-013
    title: Auto input escalation to the foreground
    behavior: >-
      Under auto input a step is tried in the background; if the driver refuses before anything was sent,
      fennec-cua raises the target window and runs the step exactly once in the foreground, reporting that it
      ran in the foreground. If the refusal comes after part of the step was sent (e.g. a later line of a
      multi-line type) it stays an error and nothing is resent or raised. A step that explicitly asks for the
      foreground runs there directly (no window needed for a desktop-wide key), but the allowlist then judges
      it by the current front window and refuses it, sending nothing, when that window is not admitted; under
      plain background input an explicit foreground request is refused.
    surface: policy
    parity: oracle
    tests: [internal/policy.TestAutoEscalatesOnceWhenNothingSent, internal/policy.TestAutoNoResendAfterPartialSend, internal/policy.TestAutoExplicitForeground]
    upstream:
      - rust/desk/src/desk.rs::auto_input_refused_before_any_was_sent_fronts_its_window_and_runs_once_in_the_foreground
      - rust/desk/src/desk.rs::auto_input_refused_after_some_was_sent_stays_an_error_and_is_not_sent_again
      - rust/desk/src/desk.rs::auto_input_asked_for_the_foreground_passes_the_allowlist_by_the_front_window
      - rust/desk/src/desk.rs::auto_input_asked_for_the_foreground_runs_there_without_a_window

  - id: CAP-DSK-014
    title: Background typing follows the keyboard focus
    behavior: >-
      After a background click, the click's answer reports the focused element (role, name) and whether the
      focus is at the clicked point. A following background type is refused with nothing typed when the
      focus did not move to the clicked field, naming the field that holds it; after a key such as Tab moves
      the focus deliberately, typing goes through. When the app exposes no focused text field at all, typing
      is refused with a hint to confirm the field in a screenshot and retry with focus=unverified; with that
      flag the text is sent and the result is unconfirmed with a note to check the field before Return/Send.
    surface: act
    parity: oracle
    tests: [internal/actions.TestBackgroundTypeChecksFocusAfterClick, internal/actions.TestTypeFocusUnverified]
    upstream:
      - rust/desk/src/desk.rs::background_typing_after_a_click_the_keyboard_focus_did_not_follow_is_refused
      - rust/desk/src/desk.rs::background_typing_after_a_click_into_an_app_with_no_focused_text_field_needs_focus_unverified

  - id: CAP-DSK-015
    title: Multi-line typing, terminals and partial failures
    behavior: >-
      A type step reports terminal=true when the driver identifies the target as a terminal emulator,
      whether or not it confirmed the text. With background input on macOS, a line a terminal took without
      the driver confirming it (as at a prompt without echo) ends the step before that line's Return, with an
      error naming the line ("line N of M") and the driver's note, so a half-typed command is never run;
      earlier confirmed lines keep their Returns. When a later line fails for any reason, the error says how
      many lines were typed before it, so the agent does not retype them; a single-line failure says nothing
      about lines.
    surface: act
    parity: oracle
    tests: [internal/actions.TestTypeTerminalFlag, internal/actions.TestTerminalLineWithoutConfirmGetsNoReturn, internal/actions.TestTypeReportsLinesTypedBeforeFailure]
    upstream:
      - rust/desk/src/desk.rs::a_type_that_fails_on_a_later_line_says_how_many_went_in
      - rust/desk/src/desk.rs::a_type_into_a_terminal_says_so_whether_or_not_the_driver_confirmed_it
      - rust/desk/src/desk.rs::a_line_a_terminal_did_not_confirm_gets_no_return_and_other_lines_do

  - id: CAP-DSK-016
    title: Locked screen and locked-input mode
    behavior: >-
      When the screen is locked or showing the screen saver, an input step fails with an error explaining
      that macOS hides windows and routes input to the lock screen, and that fennec-cua cannot reach the
      lock screen's password field (said once, in every input mode). With the locked-input policy on and
      background input, keys and typing (only those, never clicks) ask the driver for locked delivery to the
      window that had focus before the lock; typing or keys aimed at the loginwindow process are refused as
      having no focused window and send nothing. If the bundled driver does not support locked delivery the
      step is refused with nothing sent.
    surface: policy
    parity: spec
    tests: [internal/policy.TestLockScreenRefusalHint, internal/policy.TestLockedInputKeysAndTypingOnly, internal/policy.TestLockedInputNeverTargetsLoginwindow]
    upstream:
      - rust/desk/src/desk.rs::a_lock_screen_refusal_says_once_that_shuttle_cannot_reach_the_password_field
      - rust/desk/src/desk.rs::locked_input_typing_aimed_at_loginwindows_pid_sends_nothing
      - rust/desk/src/desk.rs::locked_input_asks_the_driver_to_send_background_keys_and_typing_only

  - id: CAP-DSK-017
    title: Key names and typed text sent to the driver
    behavior: >-
      Key combinations are normalised to the driver's macOS names (super/meta become cmd, enter becomes
      return, names are case-insensitive). The plus key goes as shift+= in the foreground (HID path) and as
      a literal + in the background. Text is typed literally line by line with a Return key between lines.
      Typing pacing: foreground typing whose characters all lie in the Basic Multilingual Plane uses an
      explicit 0 ms per-character delay; background typing into a Chromium-based app uses 1 ms; other cases
      (emoji or other astral characters in the foreground, non-Chromium background) leave the driver default.
    surface: act
    parity: spec
    tests: [internal/actions.TestKeyNamesToDriver, internal/actions.TestPlusKeyByRoute, internal/actions.TestTypingDelayRules]
    upstream:
      - rust/desk/src/desk.rs::macos_sends_the_plus_key_as_shift_and_equals_only_on_the_hid_path
      - rust/desk/src/desk.rs::keys_and_text_go_to_the_desktop_in_driver_names
      - rust/desk/src/desk.rs::macos_typing_sets_the_driver_delay_for_foreground_basic_plane_text_and_background_chromium_apps

  - id: CAP-DSK-018
    title: Stray agent-protocol tags are not typed
    behavior: >-
      Before typing, trailing closing tags of agent tool-call markup (text, parameter, invoke, function_calls,
      function_call, tool_use, tool_call and their namespaced variants) on their own trailing lines are dropped
      when the text never opened them; a closing tag the text itself opened, any closing tag inside a line,
      and ordinary HTML closers are typed unchanged. Empty text stays empty.
    surface: act
    parity: spec
    tests: [internal/actions.TestStripTrailingProtocolTags]
    upstream:
      - rust/desk/src/desk.rs::typed_lines_keep_a_closing_tag_the_text_opens_and_drop_one_it_does_not
      - rust/desk/src/desk.rs::a_trailing_protocol_tail_goes_only_when_the_text_does_not_open_it

  - id: CAP-DSK-019
    title: Bounded settle after typing
    behavior: >-
      After typing, fennec-cua waits at most 100 ms for the focused element's value to contain the typed
      tail (the last 16 characters after the final line break; nothing when the text ends in a line break),
      polling every 10 ms. A focus lookup that never answers is cut off within that budget, so the step
      returns well under a second and the desk is free for the next call at once.
    surface: act
    parity: spec
    tests: [internal/actions.TestTypeSettleBounded, internal/actions.TestTypedTail]
    upstream:
      - rust/desk/src/desk.rs::a_focused_lookup_that_never_answers_ends_within_the_settle_and_frees_the_desk
      - rust/desk/src/desk.rs::a_run_repeats_a_character_freely_and_the_typed_tail_is_the_last_line_end

  - id: CAP-DSK-020
    title: Serial input turn and busy timeout
    behavior: >-
      Input actions run one at a time: two concurrent type steps never interleave their characters. An
      element click holds the input turn until the driver has clicked. A new action waits a bounded time for
      the running one (15 s by default) and then fails with a desk-busy error, without sending anything,
      while the running action completes intact.
    surface: daemon
    parity: spec
    tests: [internal/daemon.TestConcurrentTypingSerialised, internal/daemon.TestBusyTimeout, internal/daemon.TestElementClickHoldsTurn]
    upstream:
      - rust/desk/src/desk.rs::two_typing_calls_at_once_type_one_after_the_other
      - rust/desk/src/desk.rs::an_action_waits_a_bounded_time_for_a_running_one_then_says_the_desk_is_busy
      - rust/desk/src/desk.rs::an_element_click_holds_the_input_turn_until_the_driver_clicks

  - id: CAP-DSK-021
    title: Foreground input raises the named window first
    behavior: >-
      Under foreground input, a key or type step naming a window (by title, pid or app) first brings that
      window to the front and then sends to the desktop; named-window pointer steps convert window-relative
      points to screen points. If the window does not come to the front, the step fails saying it is not
      frontmost and naming the actual front window, and nothing is typed or pressed.
    surface: act
    parity: oracle
    tests: [internal/actions.TestForegroundRaisesNamedWindow, internal/actions.TestForegroundUnfrontedSendsNothing]
    upstream:
      - rust/desk/src/desk.rs::foreground_input_raises_the_named_window_and_goes_to_the_desktop_at_its_pixels
      - rust/desk/src/desk.rs::foreground_keys_naming_an_app_bring_its_window_to_the_front_first
      - rust/desk/src/desk.rs::foreground_input_to_a_window_that_cannot_come_to_the_front_sends_nothing_on_macos
      - rust/desk/src/desk.rs::windows_foreground_typing_into_a_named_window_raises_it_first

  - id: CAP-DSK-022
    title: Foreground pointer raise rules
    behavior: >-
      A foreground click, scroll or drag in a named window raises that window only when the point lies inside
      it and another window is on top there; it waits up to 500 ms for the cover to leave. It does not raise
      when the point is outside the named window or over no window. A covering window of the same app is
      raised past only when it is a listed top-level window; an untitled one, or one the window list does not
      list (a popup or owned dialog matched by window number, else by title), counts as the target's own.
      On macOS a foreground click on a covered point of a named window goes to that window.
    surface: act
    parity: oracle
    tests: [internal/actions.TestForegroundPointerRaiseRules, internal/ax.TestListedTopLevelByNumberOrTitle]
    upstream:
      - rust/desk/src/desk.rs::a_foreground_click_where_no_window_is_does_not_raise_the_named_one
      - rust/desk/src/desk.rs::a_same_app_window_on_top_is_raised_past_unless_the_desk_does_not_list_it
      - rust/desk/src/desk.rs::a_point_outside_the_named_window_does_not_raise_it
      - rust/desk/src/desk.rs::a_listed_window_is_found_by_its_number_where_frames_carry_one_else_by_title
      - rust/desk/src/desk.rs::a_foreground_click_on_a_covered_point_goes_to_the_named_window_on_macos

  - id: CAP-DSK-023
    title: macOS click targets the top window under the point
    behavior: >-
      A macOS click by screen point raises the topmost window under it, then clicks inside that window in its
      own pixel space (with count for double clicks) using the foreground route; a point over no window is
      clicked on the desktop. When the driver has no WindowServer connection or the window refuses pointer
      input (e.g. a sheet), the click falls back to a plain desktop click. A window's state is read once and
      reused while it has not moved, and read again when the driver forgot it or the display scale changes
      (no read at scale 1).
    surface: act
    parity: spec
    tests: [internal/actions.TestClickTargetsTopWindow, internal/actions.TestClickDesktopFallbacks, internal/driver.TestWindowStateReadReuse]
    upstream:
      - rust/desk/src/desk.rs::a_macos_click_targets_the_top_window_under_the_point_in_its_pixels
      - rust/desk/src/desk.rs::a_macos_window_click_without_a_windowserver_connection_goes_to_the_desktop
      - rust/desk/src/desk.rs::a_macos_click_into_a_window_refusing_pointer_input_goes_to_the_desktop
      - rust/desk/src/desk.rs::macos_clicks_read_an_unmoved_window_once_and_again_when_the_driver_forgot_it
      - rust/desk/src/desk.rs::a_macos_click_takes_the_display_scale_of_the_moment
      - rust/desk/src/desk.rs::on_linux_a_window_input_drops_the_read_its_driver_session_held

  - id: CAP-DSK-024
    title: Click under another app's window
    behavior: >-
      A macOS foreground click on a point covered by another app's window, or where the hit test fails and
      the window list does not show the target on top, is sent in the background to the target window
      without moving the pointer and reported unconfirmed with a note to confirm by read-back; when the hit
      test fails but the window list shows the target on top, it is a normal foreground click. A click in a
      named window whose point another app covers, where that window takes no background click, is refused
      with nothing clicked and a hint to bring the window to the front first; it never falls back to a
      desktop click.
    surface: act
    parity: oracle
