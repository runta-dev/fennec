      - rust/desk/src/desk.rs::a_pointless_windows_scroll_refuses_a_front_window_another_window_covers
    reason: >-
      Windows-only rules (auto drags start in the foreground, each foreground line goes as one text, a
      point-less scroll wheels at the window centre and refuses when covered); on macOS drags follow the normal
      auto escalation and a point-less scroll sends scroll keys to the window (CAP-DSK-045).
  - upstream:
      - rust/desk-core/src/wire.rs::a_frame_round_trips
      - rust/desk-core/src/wire.rs::the_tool_of_a_frame_comes_without_its_arguments
