      - rust/desk/src/desk.rs::a_launch_with_arguments_starts_a_new_instance_on_macos_with_them
      - rust/desk/src/desk.rs::a_launch_with_only_urls_hands_them_to_the_running_app_on_macos
      - rust/desk/src/desk.rs::a_launch_the_driver_refuses_by_name_retries_once_by_the_running_apps_bundle
      - rust/desk/src/desk.rs::an_allowlist_refuses_launch_flags_and_keeps_plain_arguments

  - id: CAP-DSK-034
    title: A plan's launch step fronts what it launched
    behavior: >-
