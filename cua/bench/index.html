<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fennec-cua Bench</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="macOSWorld results for cua-driver, shuttle and fennec-cua: the same model and agent loop, one fresh tart VM per trial.">
<meta name="color-scheme" content="dark light">
<script>
  /* The theme is set before the first paint: a saved choice, else the system's. */
  (function () {
    var t = null;
    try { t = localStorage.getItem("cua-bench-theme"); } catch (e) {}
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
/* Tokens and components follow the FrontierHarness Eval page (frontierharness.org). */
:root {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f5f5f4; --surface-3: #e9e9e7;
  --border: #e4e4e1; --ink: #111111; --ink-2: #5c5c59; --ink-3: #8c8c88; --grid: #ececea;
  --accent: #2a78d6; --baseline: #9a9a96; --pass: #1baf7a; --fail: #e34948; --timeout: #eda100;
  --frontier: #ea580c; --infra: #8c6bd6;
  --radius: 6px;
  --font: "Inter", -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --nav-h: 48px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #111111; --surface: #161616; --surface-2: #1e1e1e; --surface-3: #2a2a2a;
  --border: #2a2a29; --ink: #ececea; --ink-2: #a3a3a0; --ink-3: #6f6f6c; --grid: #242423;
  --accent: #3987e5; --baseline: #6e6e6b; --pass: #199e70; --fail: #e66767; --timeout: #c98500;
  --frontier: #fb923c; --infra: #9085e9;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
h1, h2, h3, p { margin: 0; }
.hidden { display: none !important; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.dim { color: var(--ink-2); }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 20px; }
.link { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--ink-3); }
.link:hover { text-decoration-color: var(--ink); }

.announce { background: color-mix(in srgb, var(--pass) 14%, var(--bg)); border-bottom: 1px solid color-mix(in srgb, var(--pass) 32%, var(--bg)); font-size: 12.5px; }
.announce-inner { height: 34px; display: flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; overflow: hidden; }
.announce strong { font-weight: 600; }
.announce .sub { opacity: 0.7; }

.nav { position: sticky; top: 0; z-index: 20; height: var(--nav-h); background: var(--bg); border-bottom: 1px solid var(--border); }
.nav-inner { height: 100%; display: flex; align-items: center; gap: 22px; }
.brand { font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
.brand-logo { width: 26px; height: 26px; border-radius: 6px; background: var(--ink); color: var(--bg); display: inline-flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 12px; font-weight: 600; }
.tabs { display: flex; gap: 2px; height: 100%; position: relative; }
.tabs a { display: flex; align-items: center; padding: 0 9px; color: var(--ink-2); white-space: nowrap; position: relative; }
.tabs a:hover, .tabs a.active { color: var(--ink); }
.tabs a.active::after { content: ""; position: absolute; left: 9px; right: 9px; bottom: -1px; height: 2px; background: var(--ink); }
.nav-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.nav-status { display: flex; align-items: center; gap: 18px; white-space: nowrap; }
.nav-cell { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
.nav-cell .k { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.nav-cell .v { font-family: var(--mono); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.icon-btn { width: 28px; height: 28px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex: none; }
.dot.live { background: var(--pass); position: relative; }
.dot.live::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--pass); animation: ping 1.6s cubic-bezier(0, 0, 0.2, 1) infinite; }
.dot.done { background: var(--pass); }
.dot.stale { background: var(--timeout); }
@keyframes ping { 70%, 100% { transform: scale(2.8); opacity: 0; } }

#main { padding-top: 22px; padding-bottom: 40px; min-height: calc(100vh - var(--nav-h) - 60px); }
.page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 14px; flex-wrap: wrap; }
.page-title { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.page-title .muted { font-weight: 400; margin-left: 8px; }
.page-sub { color: var(--ink-2); max-width: 820px; margin-top: 2px; }
.section { margin-top: 26px; }
.section-title { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; margin-bottom: 8px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.section-title .muted { text-transform: none; letter-spacing: 0; font-weight: 400; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.card-title { font-weight: 600; font-size: 13px; }
.card-note { color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.kpi { padding: 12px 14px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); margin: 0 -1px -1px 0; min-width: 0; }
.kpi .k { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.kpi .v { font-family: var(--mono); font-size: 20px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .s { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.table-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 11.5px; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface); }
.tbl th.num, .tbl td.num { text-align: right; }
.tbl thead th[data-key] { cursor: pointer; user-select: none; }
.tbl thead th[data-key]:hover, .tbl th.sorted { color: var(--ink); }
.tbl th[data-dir]::after { content: "↓"; margin-left: 3px; font-size: 10px; }
.tbl th[data-dir="asc"]::after { content: "↑"; }
.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
.tbl td.mono { font-size: 12.5px; }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl tr.row-link { cursor: pointer; }
.tbl tr.lead td { font-weight: 500; }
.tbl tr.group td { background: var(--surface-2); color: var(--ink-2); font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.tbl .ci { color: var(--ink-3); font-size: 11px; margin-left: 4px; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--border); color: var(--ink-2); white-space: nowrap; }
.badge i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; flex: none; vertical-align: middle; margin-right: 6px; }
.rank { color: var(--ink-3); font-family: var(--mono); width: 28px; }
.row-bar { height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; min-width: 80px; }
.row-bar-fill { height: 100%; }
.score-cell { display: grid; grid-template-columns: 96px minmax(80px, 1fr); gap: 10px; align-items: center; }
.big { font-family: var(--mono); font-size: 26px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.big .u { font-size: 13px; color: var(--ink-3); margin-left: 4px; letter-spacing: 0; }
.progress { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.pbar { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; display: flex; }
.pbar > i { display: block; height: 100%; }
.pbar-text { color: var(--ink-3); font-size: 12px; display: flex; gap: 10px; white-space: nowrap; overflow: hidden; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px 18px; margin-top: 10px; }
.kv .k { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.kv .v { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.u { color: var(--ink-3); font-size: 0.85em; margin-left: 3px; }
/* metric matrix, after the FrontierHarness blog's harness figures */
:root { --mx-fill: #2a78d6; --mx-base: var(--surface-2); --mx-glow: #ea580c; }
:root[data-theme="dark"] { --mx-fill: #3987e5; --mx-base: #0b0b0b; --mx-glow: #fb923c; }
.mx { min-width: 0; }
.mx-show { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
.mx-k { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.mx-toggle { display: inline-flex; flex-wrap: wrap; gap: 1px; background: var(--border); border: 1px solid var(--border); }
.mx-toggle button { min-height: 32px; padding: 0 12px; font-size: 12.5px; color: var(--ink-2); background: var(--bg); }
.mx-toggle button:hover { color: var(--ink); background: var(--surface-2); }
.mx-toggle button[aria-pressed="true"] { color: var(--ink); background: var(--surface-3); box-shadow: inset 0 -2px 0 var(--mx-glow); }
.mx-scroll { overflow-x: auto; }
.mx table { border-collapse: separate; border-spacing: 2px; width: 100%; min-width: 520px; table-layout: fixed; font-size: 12px; }
.mx thead th:first-child { width: 220px; }
.mx th, .mx td { padding: 0; border: 0; vertical-align: middle; }
.mx thead th { color: var(--ink-3); font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; text-align: center; padding-bottom: 4px; white-space: nowrap; }
.mx thead th:first-child { text-align: left; padding-left: 2px; }
.mx thead th[data-column-active], .mx thead th[aria-sort] { color: var(--ink); }
.mx thead th button { width: 100%; min-height: 28px; padding: 0 4px; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; white-space: nowrap; }
.mx thead th button:hover { color: var(--ink); }
.mx thead th button span { display: inline-block; width: 0.9em; color: var(--mx-glow); }
.mx tbody th { position: sticky; left: 0; z-index: 1; width: 220px; background: var(--bg); text-align: left; font-weight: 500; color: var(--ink-2); white-space: nowrap; padding: 0 12px 0 2px; height: 28px; }
.mx tbody tr[data-row-active] th, .mx tbody tr:hover th { color: var(--ink); }
.mx tbody tr.mx-group th { height: auto; padding: 10px 2px 4px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.mx tbody td { min-width: 72px; height: 28px; text-align: center; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12px; color: var(--ink); transition: opacity 0.1s; }
.mx tbody td[data-leader] { font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--ink); }
.mx tbody td[data-task] { cursor: pointer; }
.mx tbody td.mx-empty { color: var(--ink-3); background: var(--surface-2); }
.mx table[data-active] tbody tr:not([data-row-active]) td:not([data-column-active]) { opacity: 0.32; }
.mx-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
@media (max-width: 639px) {
  .mx-toggle { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; }
  .mx-toggle button { min-height: 40px; padding: 0 6px; }
  .mx thead th:first-child { width: 120px; }
  .mx table { min-width: 0; }
  .mx tbody td { min-width: 56px; }
  .mx tbody th { width: 120px; overflow: hidden; text-overflow: ellipsis; }
}
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.seg button { padding: 3px 10px; font-size: 12px; color: var(--ink-2); border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--surface-3); color: var(--ink); }
.feed-list { max-height: 640px; overflow-y: auto; }
.tl-item { display: grid; grid-template-columns: 64px 104px minmax(0, 1fr) 70px 150px; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--grid); align-items: baseline; font-size: 12.5px; cursor: pointer; }
.tl-item:hover { background: var(--surface-2); }
.tl-item:last-child { border-bottom: 0; }
.tl-time, .tl-meta { color: var(--ink-3); font-family: var(--mono); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-meta { text-align: right; }
.tl-task { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-family: var(--mono); font-size: 11px; padding: 2px 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--border); white-space: nowrap; }
.steps { display: flex; flex-direction: column; gap: 8px; }
.step { border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; min-width: 0; }
.step.err { border-color: color-mix(in srgb, var(--fail) 45%, var(--border)); }
.step-head { display: flex; gap: 10px; align-items: baseline; font-size: 12px; color: var(--ink-3); margin-bottom: 4px; }
.step-head b { color: var(--accent); font-weight: 600; font-family: var(--mono); }
.step pre { margin: 4px 0 0; font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; word-break: break-word; color: var(--ink-2); max-height: 180px; overflow: auto; }
.step .say { color: var(--ink); font-size: 12.5px; margin-bottom: 4px; white-space: pre-wrap; }
.prose { max-width: 760px; }
.prose p, .prose ul { margin: 0 0 12px; color: var(--ink-2); }
.prose h2 { font-size: 14px; margin: 22px 0 8px; }
.prose code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); padding: 1px 4px; border-radius: 3px; }
.empty-state { color: var(--ink-3); padding: 24px 0; text-align: center; }

.modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.45); }
.modal-card { position: relative; width: min(1040px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3); }
.modal-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.modal-title { font-weight: 600; font-size: 15px; }
.modal-desc { color: var(--ink-3); font-size: 12px; margin-top: 2px; }
.shot { width: 100%; border: 1px solid var(--border); border-radius: var(--radius); display: block; }
.status-pill { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 5px 12px; border-radius: 14px; font-size: 12px; z-index: 60; }

@media (max-width: 980px) {
  .g2, .g3 { grid-template-columns: minmax(0, 1fr) !important; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .nav-status .nav-cell:nth-child(n+3) { display: none; }
}
@media (max-width: 720px) {
  .wrap { padding: 0 16px; }
  .nav-inner { gap: 10px; }
  .brand .name { display: none; }
  .nav-status { gap: 10px; }
  .nav-status { display: none; }
  .kpis .kpi:last-child { grid-column: span 2; }
  .tl-item { grid-template-columns: 48px minmax(0, 1fr) 44px; }
  .tl-item .tl-backend, .tl-item .tl-meta { display: none; }
  .hide-sm { display: none; }
}
</style>
</head>
<body>

<div class="announce" id="announce">
  <div class="wrap announce-inner"><i class="dot" id="announce-dot"></i><strong id="announce-title">Loading results</strong><span class="sub" id="announce-sub"></span></div>
</div>

<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="#leaderboard"><span class="brand-logo">fc</span><span class="name">fennec-cua bench</span></a>
    <nav class="tabs" id="tabs">
      <a data-view="leaderboard" href="#leaderboard">leaderboard</a>
      <a data-view="tasks" href="#tasks">tasks</a>
      <a data-view="live" href="#live">live</a>
      <a data-view="about" href="#about">about</a>
    </nav>
    <div class="nav-right">
      <div class="nav-status" id="nav-status"></div>
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">&#9680;</button>
    </div>
  </div>
</header>

<main class="wrap" id="main"><div class="empty-state">Loading&hellip;</div></main>

<div class="modal hidden" id="modal">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div><div class="modal-title" id="modal-title"></div><div class="modal-desc" id="modal-desc"></div></div>
      <button class="icon-btn" data-close aria-label="Close">&#10005;</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>
<div class="status-pill hidden" id="status-pill">reconnecting&hellip;</div>

<script>
"use strict";
/* The page draws data.json (written by cua-bench export, or served live by
   cua-bench web, which also serves each run's transcript at run?...). */
var COLORS = { "cua-driver": "var(--baseline)", "shuttle": "var(--accent)", "fennec-cua": "var(--frontier)" };
var POLL_MS = 15000;
var state = { raw: null, set: null, data: null, view: "leaderboard", sort: { key: "mean", dir: "desc" }, mx: { apps: { metric: "score", sort: null }, tasks: { metric: "score", sort: null } }, lastOK: 0 };
try { state.set = localStorage.getItem("cua-bench-set"); } catch (e) {}
/* ?set=NAME picks a set, for links. */
(function () { var m = /[?&]set=([\w-]+)/.exec(location.search); if (m) state.set = m[1]; })();

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function color(b) { return COLORS[b] || "var(--infra)"; }
function swatch(b) { return '<span class="swatch" style="background:' + color(b) + '"></span>'; }
function short(id) { var u = id.split("/")[1] || id; return u.slice(0, 8); }
function fmt1(x) { return isFinite(x) ? x.toFixed(1) : "–"; }
function pct(x) { return isFinite(x) ? Math.round(x * 100) + "%" : "–"; }
function dur(ms) {
  if (!isFinite(ms) || ms < 0) return "–";
  var s = Math.round(ms / 1000);
  if (s < 60) return s + "s";
  var m = Math.floor(s / 60);
  if (m < 60) return m + "m" + String(s % 60).padStart(2, "0") + "s";
  return Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0") + "m";
}
function kTok(n) { return n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n); }
function clock(t) { var d = new Date(t); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
function scoreColor(s) {
  /* 0 = fail red, 100 = pass green, mixed through the surface. */
  if (s >= 99.5) return "color-mix(in srgb, var(--pass) 45%, var(--surface))";
  if (s <= 0.5) return "color-mix(in srgb, var(--fail) 40%, var(--surface))";
  return "color-mix(in srgb, var(--timeout) " + Math.round(35 + s * 0.3) + "%, var(--surface))";
}
function taskOf(id) { return state.data.tasksById[id] || { id: id, app: "", category: id.split("/")[0] }; }
function taskLabel(id) { var t = taskOf(id); return (t.app || t.category) + " · " + short(id); }

/* ------------------------------------------------------------- data */
/* Evaluation sets (bench/sets): each ranks on its own. scoped() narrows the
   raw data to one set; runs made with a corrected grader and tasks the set
   skips are kept apart from the ranking. A sealed (held-out) set shows
   rankings only. */
function hasTag(t, tag) { return (t.tags || []).some(function (x) { return x.split(":")[0].trim() === tag; }); }
function currentSet(raw) {
  var sets = raw.sets || [];
  if (!sets.length) return null;
  return sets.filter(function (s) { return s.name === state.set; })[0] || sets[0];
}
function scoped(raw, set) {
  var d = Object.assign({}, raw);
  d.set = set;
  d.skipped = 0;
  if (set) {
    var inSet = {};
    set.tasks.forEach(function (id) { inSet[id] = true; });
    var all = raw.tasks.filter(function (t) { return inSet[t.id]; });
    d.tasks = all.filter(function (t) { return !hasTag(t, "skip"); });
    d.skipped = all.length - d.tasks.length;
    var run = {};
    d.tasks.forEach(function (t) { run[t.id] = true; });
    d.runs = raw.runs.filter(function (r) { return run[r.task]; });
    d.harness_failures = raw.harness_failures.filter(function (r) { return run[r.task]; });
    d.details = raw.details && !set.sealed;
  }
  d.corrected = d.runs.filter(function (r) { return r.corrected; });
  d.runs = d.runs.filter(function (r) { return !r.corrected; });
  return d;
}
function sealed() { return !!(state.data.set && state.data.set.sealed); }
function setPicker() {
  var sets = state.raw.sets || [];
  if (sets.length < 2) return "";
  var cur = state.data.set ? state.data.set.name : "";
  return '<div class="seg" role="group" aria-label="Evaluation set">' + sets.map(function (s) {
    return '<button data-set="' + esc(s.name) + '" class="' + (s.name === cur ? "on" : "") + '" aria-pressed="' + (s.name === cur) + '">' + esc(s.name) + (s.sealed ? " (sealed)" : "") + "</button>";
  }).join("") + "</div>";
}
function prepare(d) {
  state.data = d; /* taskOf reads it while the stats are built */
  d.tasksById = {};
  d.tasks.forEach(function (t, i) { t.index = i; d.tasksById[t.id] = t; });
  d.planned = d.tasks.length * d.backends.length * d.trials;
  d.cells = {}; /* backend|task -> runs */
  d.runs.forEach(function (r) {
    var k = r.backend + "|" + r.task;
    (d.cells[k] = d.cells[k] || []).push(r);
  });
  d.stats = d.backends.map(function (b) { return backendStats(d, b); });
  d.done = d.runs.length >= d.planned;
  var starts = d.runs.concat(d.harness_failures).map(function (r) { return Date.parse(r.started); }).filter(isFinite);
  d.first = starts.length ? Math.min.apply(null, starts) : NaN;
  var ends = d.runs.map(function (r) { return Date.parse(r.started) + r.total_ms; }).filter(isFinite);
  d.last = ends.length ? Math.max.apply(null, ends) : NaN;
  /* Throughput over the last 40 minutes of finished runs gives the time left. */
  var recent = ends.filter(function (t) { return t > d.last - 40 * 60000; });
  d.rate = recent.length > 1 ? (recent.length - 1) / Math.max(1, d.last - Math.min.apply(null, recent)) : NaN; /* runs per ms */
  d.left = d.done ? 0 : (d.planned - d.runs.length) / d.rate;
  return d;
}

function backendStats(d, b) {
  var runs = d.runs.filter(function (r) { return r.backend === b; });
  var n = runs.length, sum = 0, sq = 0, solved = 0, turns = 0, calls = 0, errs = 0, tok = 0, agent = 0;
  runs.forEach(function (r) {
    sum += r.score; sq += r.score * r.score; if (r.score >= 100) solved++;
    turns += r.turns; calls += r.tool_calls; errs += r.tool_errors; tok += r.input_tokens + r.output_tokens; agent += r.agent_ms;
  });
  var mean = n ? sum / n : NaN;
  var sd = n > 1 ? Math.sqrt(Math.max(0, (sq - n * mean * mean) / (n - 1))) : NaN;
  /* Per task: solved in every finished trial (pass^k) and in any (pass@k). */
  var all = 0, any = 0, tasksSeen = 0, done = 0;
  d.tasks.forEach(function (t) {
    var rs = d.cells[b + "|" + t.id] || [];
    if (!rs.length) return;
    tasksSeen++;
    if (rs.length >= d.trials) done++;
    var ok = rs.filter(function (r) { return r.score >= 100; }).length;
    if (ok === rs.length) all++;
    if (ok > 0) any++;
  });
  var harness = d.harness_failures.filter(function (r) { return r.backend === b; }).length;
  var apps = {};
  runs.forEach(function (r) {
    var a = taskOf(r.task).app || taskOf(r.task).category;
    apps[a] = apps[a] || { n: 0, sum: 0 };
    apps[a].n++; apps[a].sum += r.score;
  });
  return {
    backend: b, n: n, mean: mean, ci: n > 1 ? 1.96 * sd / Math.sqrt(n) : NaN,
    solved: n ? solved / n : NaN, all: tasksSeen ? all / tasksSeen : NaN, any: tasksSeen ? any / tasksSeen : NaN,
    tasksSeen: tasksSeen, tasksDone: done,
    turns: n ? turns / n : NaN, calls: n ? calls / n : NaN, errRate: calls ? errs / calls : NaN,
    tokens: n ? tok / n : NaN, agent: n ? agent / n : NaN, harness: harness, apps: apps
  };
}

/* Safety: macOSWorld's in-process distraction outcome per run. */

/* Every set's ranking at a glance: mean score per backend. */

function kpi(k, v, s) { return '<div class="kpi"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div><div class="s">' + esc(s) + "</div></div>"; }
function th(key, label, num, title) {

}

/* ----------------------------------------------------------- matrix */
/* A metric matrix after the FrontierHarness blog's harness figures: a SHOW
   toggle picks the metric, colour is relative to each column (the column's
   best is clear, the further from it the stronger the fill), the best cell
   of each column is outlined, headers sort, and hovering a cell dims all
   but its row and column. */
var METRICS = {
  score: { label: "Mean score", better: 1, of: function (rs) { return avg(rs, function (r) { return r.score; }); }, fmt: function (v) { return v.toFixed(v >= 99.95 || v === 0 ? 0 : 1); } },
  solved: { label: "Solved", better: 1, of: function (rs) { return avg(rs, function (r) { return r.score >= 100 ? 1 : 0; }); }, fmt: pct },
  turns: { label: "Turns", better: -1, of: function (rs) { return avg(rs, function (r) { return r.turns; }); }, fmt: fmt1 },
  time: { label: "Agent time", better: -1, of: function (rs) { return avg(rs, function (r) { return r.agent_ms; }); }, fmt: dur },
  tokens: { label: "Tokens", better: -1, of: function (rs) { return avg(rs, function (r) { return r.input_tokens + r.output_tokens; }); }, fmt: kTok }
};
function avg(rs, f) { return rs.length ? rs.reduce(function (s, r) { return s + f(r); }, 0) / rs.length : NaN; }

/* spec: { id, metrics: [keys], rows: [{key, label, html}], cols: [{key, label}],
   runs(rowKey, colKey) -> runs, cellAttrs(rowKey, colKey) -> string, groups(row) -> group label or "" } */
function matrix(spec) {
  var st = state.mx[spec.id];
  var m = METRICS[st.metric];
  var vals = {};
  spec.rows.forEach(function (r) {
    vals[r.key] = {};
    spec.cols.forEach(function (c) { var rs = spec.runs(r.key, c.key); vals[r.key][c.key] = { v: rs.length ? m.of(rs) : NaN, n: rs.length }; });
  });
  /* Best and worst for the fill, per column (backends compared on an app)
     or per row (backends compared on a task). */
  var byRow = spec.relative === "row", range = {};
  function bounds(xs) {
    xs = xs.filter(isFinite);
    var best = m.better > 0 ? Math.max.apply(null, xs) : Math.min.apply(null, xs);
    var worst = m.better > 0 ? Math.min.apply(null, xs) : Math.max.apply(null, xs);
    return { best: best, worst: worst, count: xs.filter(function (x) { return x === best; }).length };
  }
  if (byRow) spec.rows.forEach(function (r) { range[r.key] = bounds(spec.cols.map(function (c) { return vals[r.key][c.key].v; })); });
  else spec.cols.forEach(function (c) { range[c.key] = bounds(spec.rows.map(function (r) { return vals[r.key][c.key].v; })); });
  var along = byRow ? "row" : "column";
  var rows = spec.rows.slice();
  if (st.sort) {
    rows.sort(function (a, b) {
      var x = vals[a.key][st.sort.col].v, y = vals[b.key][st.sort.col].v;
      if (!isFinite(x)) return 1;
      if (!isFinite(y)) return -1;
      return (x - y) * (st.sort.dir === "asc" ? 1 : -1);
    });
  }
  var h = '<div class="mx" data-mx="' + spec.id + '"><div class="mx-show"><span class="mx-k">Show</span><div class="mx-toggle">' +
    spec.metrics.map(function (k) { return '<button data-mx-metric="' + k + '" aria-pressed="' + (k === st.metric) + '">' + esc(METRICS[k].label) + "</button>"; }).join("") +
    '</div></div><div class="mx-scroll"><table><thead><tr><th>' + esc(spec.corner) + "</th>" +
    spec.cols.map(function (c) {
      var s = st.sort && st.sort.col === c.key ? st.sort.dir : "";
      return '<th' + (s ? ' aria-sort="' + (s === "asc" ? "ascending" : "descending") + '"' : "") + '><button data-mx-sort="' + esc(c.key) + '">' + esc(c.label) + "<span>" + (s === "asc" ? "↑" : s === "desc" ? "↓" : "") + "</span></button></th>";
    }).join("") + "</tr></thead><tbody>";
  var group = null;
  rows.forEach(function (r) {
    if (!st.sort && spec.groups) {
      var g = spec.groups(r);
      if (g !== group) { group = g; h += '<tr class="mx-group"><th colspan="' + (spec.cols.length + 1) + '">' + esc(g) + "</th></tr>"; }
    }
    h += '<tr data-row="' + esc(r.key) + '"><th>' + r.html + "</th>";
    spec.cols.forEach(function (c) {
      var x = vals[r.key][c.key], rg = range[byRow ? r.key : c.key];
      if (!isFinite(x.v)) { h += '<td class="mx-empty" data-col="' + esc(c.key) + '">–</td>'; return; }
      var span = Math.abs(rg.best - rg.worst);
      var t = span > 0 ? Math.abs(x.v - rg.best) / span : 0; /* 0 at the column's best, 1 at its worst */
      var lead = x.v === rg.best && rg.count === 1; /* only a sole best is outlined */
      h += '<td data-col="' + esc(c.key) + '"' + (lead ? " data-leader" : "") + (spec.cellAttrs ? spec.cellAttrs(r.key, c.key) : "") +
        ' style="background:color-mix(in srgb, var(--mx-fill) ' + Math.round(6 + t * 58) + '%, var(--mx-base))" title="' + esc(r.label + " · " + c.label + ": " + m.fmt(x.v) + " over " + x.n + " run" + (x.n === 1 ? "" : "s")) + '">' + esc(m.fmt(x.v)) + "</td>";
    });
    h += "</tr>";
  });
  h += '</tbody></table></div><div class="mx-legend"><span>Colour is relative to each ' + along + ': clear is its best, ' + (m.better > 0 ? "higher" : "lower") + ' is better.</span><span>Outlined: the ' + along + '\'s sole best.</span><span>Select a column name to sort.</span></div></div>';
  return h;
}

function hoverMatrix(e) {
  var td = e.target.closest && e.target.closest(".mx td[data-col]");
  document.querySelectorAll(".mx table[data-active]").forEach(function (t) {
    if (td && t.contains(td)) return;
    t.removeAttribute("data-active");
    t.querySelectorAll("[data-row-active],[data-column-active]").forEach(function (x) { x.removeAttribute("data-row-active"); x.removeAttribute("data-column-active"); });
  });
  if (!td) return;
  var table = td.closest("table"), col = td.dataset.col;
  if (table.dataset.active === td.parentNode.dataset.row + "|" + col) return;
  table.querySelectorAll("[data-row-active],[data-column-active]").forEach(function (x) { x.removeAttribute("data-row-active"); x.removeAttribute("data-column-active"); });
  table.dataset.active = td.parentNode.dataset.row + "|" + col;
  td.parentNode.setAttribute("data-row-active", "");
  table.querySelectorAll('td[data-col="' + CSS.escape(col) + '"]').forEach(function (x) { x.setAttribute("data-column-active", ""); });
  var idx = Array.prototype.indexOf.call(td.parentNode.children, td);
  var head = table.querySelector("thead tr").children[idx];
  if (head) head.setAttribute("data-column-active", "");
}

function appMatrix() {
  var d = state.data, apps = appOrder();
  var cols = apps.map(function (a) { return { key: a, label: a }; }).concat([{ key: "*", label: "All tasks" }]);
  return matrix({
    id: "apps", corner: "Backend", metrics: ["score", "solved", "turns", "time", "tokens"],
    rows: d.backends.map(function (b) { return { key: b, label: b, html: swatch(b) + esc(b) }; }),
    cols: cols,
    runs: function (b, a) { return d.runs.filter(function (r) { return r.backend === b && (a === "*" || (taskOf(r.task).app || taskOf(r.task).category) === a); }); }
  });
}

function taskMatrix() {
  var d = state.data;
  return matrix({
    id: "tasks", corner: "Task", relative: "row", metrics: ["score", "solved", "turns", "time", "tokens"],
    rows: d.tasks.map(function (t) { return { key: t.id, label: taskLabel(t.id), html: '<span class="mono">' + esc(short(t.id)) + '</span> <span class="muted">' + esc(t.app || t.category) + "</span>" }; }),
    cols: d.backends.map(function (b) { return { key: b, label: b }; }),
    groups: function (r) { var t = taskOf(r.key); return t.app || t.category; },
    runs: function (t, b) { return d.cells[b + "|" + t] || []; },
    cellAttrs: function (t, b) { return ' data-task="' + esc(t) + '" data-backend="' + esc(b) + '"'; }
  });
}

/* ------------------------------------------------------------- live */
function viewLive() {
  var d = state.data;
  var runs = d.runs.slice().sort(function (a, b) { return Date.parse(b.started) - Date.parse(a.started); });
  var h = '<div class="page-head"><div><h1 class="page-title">Live<span class="muted">' + d.runs.length + " scored · " + d.harness_failures.length + ' harness failures</span></h1>' +
    '<p class="page-sub">Newest first. ' + (d.done ? "The run has finished." : "The page refreshes every " + POLL_MS / 1000 + " seconds.") + "</p></div>" + setPicker() + "</div>";
  h += '<div class="grid g2" style="grid-template-columns:minmax(0,1.85fr) minmax(0,1fr)"><div class="card"><div class="card-head"><div class="card-title">Scored runs</div><div class="card-note">click for the transcript</div></div><div class="feed-list">';
  if (!runs.length) h += '<div class="empty-state">No runs yet.</div>';
  runs.forEach(function (r) { h += feedItem(r); });
  h += '</div></div><div class="card"><div class="card-head"><div class="card-title">Harness failures</div><div class="card-note">not scored; the trial was retried</div></div><div class="feed-list">';
  var hf = d.harness_failures.slice().reverse();
  if (!hf.length) h += '<div class="empty-state">None.</div>';
  hf.forEach(function (r) {
    h += '<div class="tl-item" style="grid-template-columns:48px 90px minmax(0,1fr);cursor:default"><span class="tl-time">' + clock(r.started) + '</span><span class="tl-backend">' + swatch(r.backend) + esc(r.backend) + '</span><span class="tl-task dim" title="' + esc(r.harness_error) + '">' + esc(taskLabel(r.task)) + " — " + esc(r.harness_error) + "</span></div>";
  });
  h += "</div></div></div>";
  return h;
}
function feedItem(r) {
  var ok = r.score >= 100;
  if (sealed()) return '<div class="tl-item" style="cursor:default"><span class="tl-time">' + clock(r.started) + '</span><span class="tl-backend">' + swatch(r.backend) + esc(r.backend) + '</span><span class="tl-task dim">held-out task</span>' +
    '<span><span class="badge"><i style="background:' + (ok ? "var(--pass)" : "var(--fail)") + '"></i>' + r.score + "</span></span><span class=\"tl-meta\"></span></div>";
  return '<div class="tl-item" data-run="' + esc(r.backend + "|" + r.task + "|" + r.trial) + '"><span class="tl-time">' + clock(r.started) + '</span><span class="tl-backend">' + swatch(r.backend) + esc(r.backend) + '</span><span class="tl-task">' + esc(taskLabel(r.task)) + ' <span class="muted">trial ' + r.trial + "</span></span>" +
    '<span><span class="badge"><i style="background:' + (ok ? "var(--pass)" : "var(--fail)") + '"></i>' + r.score + "</span></span>" +
    '<span class="tl-meta">' + r.turns + " turns · " + dur(r.agent_ms) + "</span></div>";
}

/* ------------------------------------------------------------ about */
function viewAbout() {
  var d = state.data;
  return '<div class="prose"><h1 class="page-title">About this run</h1>' +
    "<h2>What is compared</h2><p>Three computer-use backends for macOS: <b>cua-driver</b> (the raw driver's MCP tools), <b>shuttle</b> and <b>fennec-cua</b>. Each is reached over MCP by the same host-side agent loop with the same model (" + esc(d.model || "unknown") + "), system prompt and turn budget. The backend's own MCP instructions are added to the prompt, as an MCP host would.</p>" +
    "<h2>Tasks</h2><p>Tasks from <a class=\"link\" href=\"https://github.com/showlab/macOSWorld\" target=\"_blank\" rel=\"noopener\">macOSWorld</a> (CC BY-NC 4.0, internal evaluation only), in evaluation sets that run and rank apart: <b>dev</b> (the tasks we develop against), <b>holdout</b> (sealed: never used for tuning, so the page shows its rankings only) and <b>safety</b> (tasks with a distracting dialog; the distracted rate is their score). Only tasks that run faithfully offline in our macOS 26 image are used; some need a setup step that recreates the state of macOSWorld's VM snapshot. The ids, apps and feasibility table are in <code>cua/bench/sets</code>; task texts and grading commands stay in a local checkout and are never shown here.</p>" +
    "<h2>Scoring</h2><p>Each trial clones a golden macOS image with tart, runs the task's setup, lets the agent work, then runs macOSWorld's grading commands in the VM. Only the grading result counts; what the model claims does not. A run that fails for reasons outside the backend (VM boot, model gateway) is a harness failure: it is retried and never scored. pass^k is the share of tasks solved in every trial, pass@k in at least one.</p>" +
    "<h2>Reproduce</h2><p><code>go run ./cmd/cua-bench run -macosworld PATH -trials " + d.trials + " -concurrency 2</code>, then <code>go run ./cmd/cua-bench web</code> for this page, or <code>export</code> for a static copy.</p>" +
    '<p class="muted">Data generated ' + esc(new Date(d.generated).toLocaleString()) + ".</p></div>";
}

/* ------------------------------------------------------------ modal */
function openModal(title, desc, body) {
  $("modal-title").textContent = title;
  $("modal-desc").textContent = desc;
  $("modal-body").innerHTML = body;
  $("modal").classList.remove("hidden");
}
function closeModal() { $("modal").classList.add("hidden"); }

function openCell(task, backend) {
  var d = state.data;
  var rs = (d.cells[backend + "|" + task] || []).slice().sort(function (a, b) { return a.trial - b.trial; });
  var body = '<table class="tbl"><thead><tr><th>trial</th><th class="num">score</th><th>stop</th><th class="num">turns</th><th class="num">tool calls</th><th>tools</th><th class="num">agent time</th></tr></thead><tbody>';
  rs.forEach(function (r) {
    var tools = Object.keys(r.tools || {}).map(function (k) { return '<span class="chip">' + esc(k) + " " + r.tools[k] + "</span>"; }).join("");
    body += '<tr class="row-link" data-run="' + esc(r.backend + "|" + r.task + "|" + r.trial) + '"><td class="mono">' + r.trial + '</td><td class="num"><span class="badge"><i style="background:' + (r.score >= 100 ? "var(--pass)" : "var(--fail)") + '"></i>' + r.score + "</span></td><td>" + esc(r.stop) + '</td><td class="num mono">' + r.turns + '</td><td class="num mono">' + r.tool_calls + '</td><td><div class="chips">' + tools + '</div></td><td class="num mono">' + dur(r.agent_ms) + "</td></tr>";
  });
  body += "</tbody></table>";
  if (!d.details) body += '<p class="muted" style="margin-top:10px">Transcripts are available when the page is served by <code>cua-bench web</code>.</p>';
  openModal(backend + " · " + taskLabel(task), task, body);
}

function openRun(key) {
  var p = key.split("|"), d = state.data;
  var r = (d.cells[p[0] + "|" + p[1]] || []).filter(function (x) { return String(x.trial) === p[2]; })[0];
  if (!r) return;
  var title = p[0] + " · " + taskLabel(p[1]) + " · trial " + p[2];
  var head = '<div class="kv" style="margin-top:0">' +
    kvc("score", r.score) + kvc("stop", r.stop || "–") + kvc("turns", r.turns) + kvc("tool calls", r.tool_calls) + kvc("tool errors", r.tool_errors) +
    kvc("tokens", kTok(r.input_tokens + r.output_tokens)) + kvc("agent time", dur(r.agent_ms)) + kvc("total", dur(r.total_ms)) + "</div>";
  if (!d.details) { openModal(title, p[1], head); return; }
  openModal(title, p[1], head + '<div class="empty-state">Loading transcript&hellip;</div>');
  fetch("run?backend=" + encodeURIComponent(p[0]) + "&task=" + encodeURIComponent(p[1]) + "&trial=" + p[2], { cache: "no-store" })
    .then(function (res) { if (!res.ok) throw new Error(res.status); return res.json(); })
    .then(function (x) {
      var body = head;
      if (x.final) body += '<div class="section"><div class="section-title">Final message</div><div class="step"><div class="say">' + esc(x.final) + "</div></div></div>";
      if (x.grading && x.grading.length) body += '<div class="section"><div class="section-title">Grading</div><div class="chips">' + x.grading.map(function (g) { return '<span class="chip">' + (g.ok ? "ran" : "error") + " · " + g.score + (g.output ? " · " + esc(g.output.trim()) : "") + "</span>"; }).join("") + "</div></div>";
      body += '<div class="section grid g2" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:start"><div><div class="section-title">Transcript<span class="muted">' + x.steps.length + " steps</span></div><div class=\"steps\">";
      x.steps.forEach(function (s, i) {
        body += '<div class="step' + (s.is_error ? " err" : "") + '"><div class="step-head"><span class="mono">' + (i + 1) + "</span>" + (s.tool ? "<b>" + esc(s.tool) + "</b>" : "<span>message</span>") + '<span class="mono">' + dur(s.ms) + "</span>" + (s.images ? "<span>" + s.images + " image</span>" : "") + (s.is_error ? '<span style="color:var(--fail)">error</span>' : "") + "</div>" +
          (s.text && (i === 0 || x.steps[i - 1].text !== s.text) ? '<div class="say">' + esc(s.text) + "</div>" : "") +
          (s.args ? "<pre>" + esc(s.args) + "</pre>" : "") + (s.result ? "<pre>" + esc(s.result) + "</pre>" : "") + "</div>";
      });
      body += "</div></div><div>" + (x.screenshot ? '<div class="section-title">Screen after the run</div><img class="shot" alt="The VM screen after the run" src="' + esc(x.screenshot) + '">' : "") + "</div></div>";
      $("modal-body").innerHTML = body;
    })
    .catch(function () { $("modal-body").innerHTML = head + '<div class="empty-state">The transcript could not be loaded.</div>'; });
}
function kvc(k, v) { return '<div><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + "</div></div>"; }

/* ----------------------------------------------------------- routing */
var VIEWS = { leaderboard: viewLeaderboard, tasks: viewTasks, live: viewLive, about: viewAbout };
function route() {
  var v = location.hash.replace("#", "");
  state.view = VIEWS[v] ? v : "leaderboard";
  draw();
}
function draw() {
  if (!state.data) return;
  var y = scrollY;
  drawChrome();
  $("main").innerHTML = VIEWS[state.view]();
  scrollTo(0, y);
}

function load() {
  fetch("data.json", { cache: "no-store" })
    .then(function (res) { if (!res.ok) throw new Error(res.status); return res.json(); })
    .then(function (d) {
      state.raw = d;
      state.data = prepare(scoped(d, currentSet(d)));
      state.lastOK = Date.now();
      $("status-pill").classList.add("hidden");
      draw();
      if (!d.done && d.details) setTimeout(load, POLL_MS);
    })
    .catch(function (err) {
      if (window.console) console.error("cua-bench page:", err);
      if (state.data) $("status-pill").classList.remove("hidden");
      else $("main").innerHTML = '<div class="empty-state">data.json could not be loaded. Serve this page with <code>cua-bench web</code> or open an exported folder over HTTP.</div>';
      setTimeout(load, POLL_MS);
    });
}

document.addEventListener("click", function (e) {
  var t = e.target;
  if (t.closest("[data-close]")) return closeModal();
  var th = t.closest("#lb th[data-key]");
  if (th) {
    var k = th.dataset.key;
    state.sort = { key: k, dir: state.sort.key === k && state.sort.dir === "desc" ? "asc" : "desc" };
    return draw();
  }
  var mx = t.closest("[data-mx]");
  if (mx) {
    var st = state.mx[mx.dataset.mx];
    var metric = t.closest("[data-mx-metric]");
    if (metric) { st.metric = metric.dataset.mxMetric; return draw(); }
    var sort = t.closest("[data-mx-sort]");
    if (sort) {
      /* first click: best first; second: reversed; third: back to the given order */
      var col = sort.dataset.mxSort, first = METRICS[st.metric].better > 0 ? "desc" : "asc";
      if (!st.sort || st.sort.col !== col) st.sort = { col: col, dir: first };
      else if (st.sort.dir === first) st.sort = { col: col, dir: first === "desc" ? "asc" : "desc" };
      else st.sort = null;
      return draw();
    }
  }
  var pick = t.closest("[data-set]");
  if (pick) {
    state.set = pick.dataset.set;
    try { localStorage.setItem("cua-bench-set", state.set); } catch (e) {}
    state.data = prepare(scoped(state.raw, currentSet(state.raw)));
    return draw();
  }
  var cell = t.closest("td[data-task]");
  if (cell) return openCell(cell.dataset.task, cell.dataset.backend);
  var run = t.closest("[data-run]");
  if (run) return openRun(run.dataset.run);
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });
document.addEventListener("mouseover", hoverMatrix);
$("theme-toggle").onclick = function () {
  var t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("cua-bench-theme", t); } catch (e) {}
};
addEventListener("hashchange", route);
route();
load();
</script>
</body>
</html>
