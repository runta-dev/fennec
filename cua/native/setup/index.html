<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Fennec CUA Setup</title>
<style>
/* Fennec's menu-bar panel tokens (native/macos/UI/panel.css): one flat
   layer of cards with hairlines on the window background. */
:root{color-scheme:light dark;--bg:#f2f2f5;--card:#fff;--text:#1c1c21;--muted:#85858d;--line:rgba(0,0,0,.07);--orange:#f38d25;--tint:#fff2e5;--ok:#5f9a59;--warn:#c25b2c}
@media(prefers-color-scheme:dark){:root{--bg:#1b1c20;--card:#25262c;--text:#eeeef0;--muted:#9c9ca6;--line:rgba(255,255,255,.07);--tint:#392c21;--ok:#86bb7f;--warn:#e58a5f}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;cursor:default;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);border-radius:7px;background:var(--card);height:26px;padding:0 10px;font-weight:500}
button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
header{height:46px;min-height:46px;display:flex;align-items:center;gap:7px;padding:0 10px 0 14px}
.brand{display:flex;align-items:center;gap:7px;font-weight:600;letter-spacing:.01em}
.brand svg{width:20px;height:20px;display:block;flex:none}
.spacer{flex:1}
.icon{width:26px;height:26px;padding:0;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;border-radius:6px}
.icon:hover{background:var(--line);color:var(--text)}
.icon svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
main{flex:1;padding:0 12px 12px}
.lead{margin:0 2px 12px;font-size:12px;line-height:1.5;color:var(--muted)}
h2{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;margin:0 2px 7px}
.step{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);background:var(--card)}
.step svg{width:9px;height:9px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.done .step{background:var(--orange);border-color:var(--orange)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px #0000000a}
.row{display:flex;align-items:center;gap:10px;height:54px;padding:0 10px 0 12px}
.row+.row{border-top:1px solid var(--line)}
.text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.text strong{font-weight:500}
.text small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.action{flex:none;width:92px;display:flex;justify-content:flex-end}
.allow{color:#b06014;border-color:#f38d2570;background:transparent}
.allow:hover{background:var(--tint)}
@media(prefers-color-scheme:dark){.allow{color:#f5a24e}}
.state{height:26px;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.state.ok{color:var(--ok)}
.state svg,.copied svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.copy{width:92px;white-space:nowrap}
.copied{display:inline-flex;align-items:center;justify-content:center;gap:5px;color:var(--ok)}
/* The hint keeps its two lines whether or not it has text: no layout shift. */
.hint{height:50px;margin:0;padding:8px 2px 0;font-size:11.5px;line-height:1.45;color:var(--muted);overflow:hidden}
.hint.ok{color:var(--ok)}
.hint.warn{color:var(--warn)}
</style>
</head>
<body>
<header>
  <div class="brand"><svg aria-hidden="true" viewBox="0 0 64 64" fill="none"><path d="M5 39V9c0-3 2-4 4-2l23 15L55 7c2-2 4-1 4 2v30L34 57c-1.2.9-2.8.9-4 0Z" fill="#FFD8A1"/><path d="m8 6 24 16-12 9Z" fill="#FFB953"/><path d="m56 6-24 16 12 9Z" fill="#F7A136"/><path d="M5 39 30 22c1.2-.8 2.8-.8 4 0l25 17-25 18c-1.2.9-2.8.9-4 0Z" fill="#F38D25"/><path d="m5 39 27-17v36L30 57Z" fill="#FFA83F"/><circle cx="24" cy="40" r="2.6" fill="#3B332E"/><circle cx="40" cy="40" r="2.6" fill="#3B332E"/><ellipse cx="32" cy="52" rx="3.2" ry="3.3" fill="#3B332E"/></svg>Fennec CUA</div>
  <div class="spacer"></div>
  <button class="icon" id="minimize" aria-label="Minimize"><svg viewBox="0 0 14 14"><path d="M3 7h8"/></svg></button>
  <button class="icon" id="close" aria-label="Close"><svg viewBox="0 0 14 14"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7"/></svg></button>
</header>
<main>
  <p class="lead">Lets your AI agents see and use the apps on this Mac. Two steps: allow access, then connect your agent.</p>
  <h2 id="step-access"><span class="step"></span>Allow access</h2>
  <div class="card">
    <div class="row">
      <div class="text"><strong>Accessibility</strong><small>Lets agents click, type and read app controls</small></div>
      <div class="action" id="accessibility"></div>
    </div>
    <div class="row">
      <div class="text"><strong>Screen Recording</strong><small>Lets agents see app windows</small></div>
      <div class="action" id="screen"></div>
    </div>
  </div>
  <p class="hint" id="hint"></p>
  <h2 id="step-connect"><span class="step"></span>Connect your agent</h2>
  <div class="card" id="agents"></div>
</main>
<script>
"use strict";
const post = (action, extra) => window.webkit.messageHandlers.setup.postMessage(Object.assign({action}, extra || {}));
const tick = '<svg viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3 4.7-4.9"/></svg>';
document.getElementById("close").onclick = () => post("close");
document.getElementById("minimize").onclick = () => post("minimize");

// The last Allow clicked, so the hint can say where to go next.
let asked = "";

// Each action slot is redrawn only when its content changes, so a click
// is never lost to the once-a-second refresh.
function slot(id, html) {
  const el = document.getElementById(id);
  if (el.dataset.html === html) return;
  el.dataset.html = html;
  el.innerHTML = html;
  const b = el.querySelector("button");
  if (b) b.onclick = () => { asked = b.dataset.action; post(b.dataset.action); };
}
const allow = (action, label) => `<button class="allow" data-action="${action}">${label || "Allow"}</button>`;
const allowed = `<span class="state ok">${tick}Allowed</span>`;
const working = '<span class="state"><span class="spin"></span>Checking</span>';

function step(id, n, done) {
  const h = document.getElementById(id);
  h.classList.toggle("done", done);
  h.querySelector(".step").innerHTML = done ? tick : String(n);
}

let copied = "";
let agentsShown = "";
function renderAgents(commands) {
  const key = JSON.stringify(commands) + copied;
  if (key === agentsShown) return;
  agentsShown = key;
  const box = document.getElementById("agents");
  box.innerHTML = "";
  for (const c of commands) {
    const row = document.createElement("div");
    row.className = "row";
    const text = document.createElement("div");
    text.className = "text";
    const name = document.createElement("strong");
    name.textContent = c.name;
    const help = document.createElement("small");
    help.textContent = copied === c.id ? "Paste into Terminal, then restart " + c.name : "Copy a command, then paste it into Terminal";
    text.append(name, help);
    const button = document.createElement("button");
    button.className = "copy";
    button.title = c.command;
    if (copied === c.id) {
      button.innerHTML = `<span class="copied">${tick}Copied</span>`;
    } else {
      button.textContent = "Copy";
    }
    button.onclick = () => {
      post("copy", {text: c.command});
      copied = c.id;
      renderAgents(commands);
      if (last) window.setupRender(last);
    };
    row.append(text, button);
    box.append(row);
  }
}

let last = null;
window.setupRender = s => {
  last = s;
  slot("accessibility", s.accessibility ? allowed : allow("accessibility"));
  let screen, hint = "", tone = "";
  if (!s.screen) screen = allow("screen");
  else if (s.capture === "ok" || !s.accessibility) screen = allowed;
  else if (s.capture === "consent") screen = allow("capture");
  else if (s.capture === "error") screen = allow("retry", "Try again");
  else screen = working;
  slot("screen", screen);

  const ready = s.accessibility && s.screen && s.capture === "ok";
  if (s.notice) { hint = s.notice; tone = "warn"; }
  else if (s.capture === "error" && s.accessibility && s.screen) { hint = s.captureDetail || "The test screenshot failed. Click Try again."; tone = "warn"; }
  else if (s.daemonError) { hint = s.daemonError; tone = "warn"; }
  else if (ready) { hint = copied ? "All set. Your agent can use this Mac after it restarts." : "Access allowed. Next, connect your agent."; tone = "ok"; }
  else if (asked === "accessibility" && !s.accessibility) hint = "In System Settings › Accessibility, turn on “Fennec CUA”. This window updates by itself.";
  else if (asked === "screen" && !s.screen) hint = "In System Settings › Screen & System Audio Recording, turn on “Fennec CUA”. This window updates by itself.";
  else if (s.capture === "consent" && s.accessibility && s.screen) hint = "One more: click Allow, then choose Allow in the macOS alert.";
  else if (s.accessibility && s.screen) hint = "Taking a test screenshot…";
  else hint = "Each Allow opens System Settings: turn on “Fennec CUA” there, then come back here.";
  const h = document.getElementById("hint");
  h.textContent = hint;
  h.title = hint;
  h.className = "hint" + (tone ? " " + tone : "");

  step("step-access", 1, ready);
  step("step-connect", 2, copied !== "");
  renderAgents(s.commands);
};
</script>
</body>
</html>
